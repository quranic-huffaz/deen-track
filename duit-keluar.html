<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabung Kelas - Rekod Duit Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px rgba(255, 255, 255, 0.08) solid;
        }
        .rose-glow {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.15);
        }
        .btn-premium-exit {
            background: linear-gradient(90deg, #f43f5e 0%, #fda4af 50%, #be123c 100%);
            transition: all 0.3s ease;
        }
        .btn-premium-exit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md glassmorphism rounded-3xl p-6 md:p-8 rose-glow relative overflow-hidden my-6">
        <div class="absolute top-0 right-0 w-32 h-32 bg-rose-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl"></div>

        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-rose-500/10 border border-rose-500/30 mb-3">
                <span class="text-rose-400 font-bold text-xl">↓</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">TABUNG KELAS</h1>
            <p class="text-xs text-rose-400 mt-1 uppercase tracking-widest">Rekod Pengeluaran Duit Keluar</p>
        </div>

        <div id="toast" class="hidden mb-4 p-3 rounded-xl text-center text-sm font-medium transition-all duration-300"></div>

        <form id="expenseForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Nama Pengeluar</label>
                <input type="text" id="nama" required placeholder="Nama individu yang mengeluarkan wang" 
                    class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-rose-500/50 focus:ring-1 focus:ring-rose-500/50 transition duration-200">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Hari</label>
                    <select id="hari" required
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500/50 focus:ring-1 focus:ring-rose-500/50 transition duration-200">
                        <option value="" disabled selected class="bg-slate-900 text-slate-400">Pilih hari</option>
                        <option value="Isnin" class="bg-slate-900">Isnin</option>
                        <option value="Selasa" class="bg-slate-900">Selasa</option>
                        <option value="Rabu" class="bg-slate-900">Rabu</option>
                        <option value="Khamis" class="bg-slate-900">Khamis</option>
                        <option value="Jumaat" class="bg-slate-900">Jumaat</option>
                        <option value="Sabtu" class="bg-slate-900">Sabtu</option>
                        <option value="Ahad" class="bg-slate-900">Ahad</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Tarikh</label>
                    <input type="date" id="tarikh" required
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500/50 focus:ring-1 focus:ring-rose-500/50 transition duration-200">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Jumlah Keluar (RM)</label>
                <div class="relative">
                    <span class="absolute left-4 top-3 text-rose-500 font-semibold">RM</span>
                    <input type="number" id="jumlah" step="0.01" min="0.01" required placeholder="0.00" 
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl pl-12 pr-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-rose-500/50 focus:ring-1 focus:ring-rose-500/50 transition duration-200 font-semibold text-lg">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full btn-premium-exit text-white font-bold py-3.5 px-4 rounded-xl mt-2 tracking-wide text-sm shadow-lg flex items-center justify-center gap-2">
                <span>REKOD ALIRAN KELUAR</span>
            </button>
        </form>

        <p class="text-center text-[10px] text-slate-500 mt-6 tracking-wide">Secured Fintech Verification System</p>
    </div>

    <script>
        // PENTING: Sila gantikan URL di bawah dengan URL Web App anda selepas deploy Google Apps Script baharu
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-2aHT0T3l4pFg2sgRJ46cFms5j2lwWYgajqzGP3MAXBOkz8DHxBr8F5BghYqGDXUa/exec";

        // Auto-detect tarikh dan hari semasa
        document.getElementById('tarikh').valueAsDate = new Date();
        const hariArray = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
        document.getElementById('hari').value = hariArray[new Date().getDay()];

        const form = document.getElementById('expenseForm');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');

        function showToast(message, isSuccess) {
            toast.textContent = message;
            toast.className = `block mb-4 p-3 rounded-xl text-center text-sm font-medium transition-all duration-300 ${
                isSuccess ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-400' : 'bg-rose-500/10 border border-rose-500/30 text-rose-400'
            }`;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Menghantar...</span>`;

            const nama = document.getElementById('nama').value;
            const hari = document.getElementById('hari').value;
            const tarikh = document.getElementById('tarikh').value;
            const jumlah = document.getElementById('jumlah').value;

            const dateParts = tarikh.split('-');
            const formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

            const formData = new FormData();
            formData.append('nama', nama);
            formData.append('hari', hari);
            formData.append('tarikh', formattedDate);
            formData.append('jumlah', jumlah);

            if(SCRIPT_URL === "SILA_GANTIKAN_DENGAN_WEB_APP_URL_ANDA") {
                showToast("Mod Simulasi: Sila isi URL Web App yang betul untuk menyimpan data.", false);
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>REKOD ALIRAN KELUAR</span>`;
                return;
            }

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if(result.status === 'success') {
                    showToast("Rekod aliran keluar wang berjaya disimpan!", true);
                    resetForm();
                } else {
                    showToast("Gagal simpan: " + result.message, false);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>REKOD ALIRAN KELUAR</span>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast("Ralat sistem rangkaian cloud.", false);
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>REKOD ALIRAN KELUAR</span>`;
            });
        });

        function resetForm() {
            form.reset();
            document.getElementById('tarikh').valueAsDate = new Date();
            document.getElementById('hari').value = hariArray[new Date().getDay()];
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>REKOD ALIRAN KELUAR</span>`;
        }
    </script>
</body>
</html>

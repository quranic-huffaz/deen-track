<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabung Kelas Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px rgba(255, 255, 255, 0.08) solid;
        }
        .gold-glow {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
        }
        .btn-premium {
            background: linear-gradient(90deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
            transition: all 0.3s ease;
        }
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md glassmorphism rounded-3xl p-6 md:p-8 gold-glow relative overflow-hidden my-6">
        <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl"></div>

        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-amber-500/10 border border-amber-500/30 mb-3">
                <span class="text-amber-400 font-bold text-xl">₸</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">TABUNG KELAS</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Sistem Pembayaran Premium</p>
        </div>

        <div class="bg-white/5 rounded-2xl p-4 mb-6 border border-white/10 text-center">
            <p class="text-xs text-amber-400 font-semibold uppercase tracking-wider mb-3">Imbas & Bayar Melalui DuitNow</p>
            <div class="bg-white p-3 rounded-xl inline-block shadow-inner mx-auto mb-2">
                <div class="w-48 h-48 bg-slate-100 flex items-center justify-center text-slate-940 text-xs border border-dashed border-slate-300 rounded-lg relative overflow-hidden">
                    <img src="image_817ea9.jpg" alt="DuitNow QR" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="hidden p-4 text-center text-slate-400">[ Sila pastikan fail imej QR anda berada di folder yang sama atau gunakan URL gambar ]</span>
                </div>
            </div>
            <p class="text-[11px] text-slate-400">Akaun Penerima: <br><span class="text-white font-medium">MUHAMMAD ARSHAD BIN TAJUDDIN</span></p>
        </div>

        <div id="toast" class="hidden mb-4 p-3 rounded-xl text-center text-sm font-medium transition-all duration-300"></div>

        <form id="paymentForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Nama Penuh</label>
                <input type="text" id="nama" required placeholder="Masukkan nama penuh anda" 
                    class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition duration-200">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Hari</label>
                    <select id="hari" required
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition duration-200">
                        <option value="" disabled selected class="bg-slate-900 text-slate-400">Pilih hari</option>
                        <option value="Isnin" class="bg-slate-900">Isnin</option>
                        <option value="Selasa" class="bg-slate-900">Selasa</option>
                        <option value="Rabu" class="bg-slate-900">Rabu</option>
                        <option value="Khamis" class="bg-slate-900">Khamis</option>
                        <option value="Jumaat" class="bg-slate-900">Jumaat</option>
                        <option value="Sabtu" class="bg-slate-900">Sabtu</option>
                        <option value="Ahad" class="bg-slate-900">Ahad</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Tarikh</label>
                    <input type="date" id="tarikh" required
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition duration-200">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Jumlah (RM)</label>
                <div class="relative">
                    <span class="absolute left-4 top-3 text-amber-500 font-semibold">RM</span>
                    <input type="number" id="jumlah" step="0.01" min="0.01" required placeholder="0.00" 
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl pl-12 pr-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition duration-200 font-semibold text-lg">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full btn-premium text-slate-950 font-bold py-3.5 px-4 rounded-xl mt-2 tracking-wide text-sm shadow-lg flex items-center justify-center gap-2">
                <span>HANTAR REKOD & NOTIFIKASI</span>
            </button>
        </form>

        <p class="text-center text-[10px] text-slate-500 mt-6 tracking-wide">Secured Fintech Verification System</p>
    </div>

    <script>
        // PENTING: Sila gantikan URL di bawah dengan URL Web App anda selepas deploy Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlbBzbJQTWfzT25aCoK5yjEXukkUtIvucgovAwfqF_uCLuv_cXKIormbBNf5e3wyRU/exec";
        const WHATSAPP_GROUP_LINK = "https://chat.whatsapp.com/JQnNtCt4DhU8fbkmL07w5l";

        // Auto-detect tarikh dan hari semasa
        document.getElementById('tarikh').valueAsDate = new Date();
        const hariArray = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
        document.getElementById('hari').value = hariArray[new Date().getDay()];

        const form = document.getElementById('paymentForm');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');

        function showToast(message, isSuccess) {
            toast.textContent = message;
            toast.className = `block mb-4 p-3 rounded-xl text-center text-sm font-medium transition-all duration-300 ${
                isSuccess ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-400' : 'bg-rose-500/10 border border-rose-500/30 text-rose-400'
            }`;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Menghantar...</span>`;

            const nama = document.getElementById('nama').value;
            const hari = document.getElementById('hari').value;
            const tarikh = document.getElementById('tarikh').value;
            const jumlah = document.getElementById('jumlah').value;

            const dateParts = tarikh.split('-');
            const formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

            const formData = new FormData();
            formData.append('nama', nama);
            formData.append('hari', hari);
            formData.append('tarikh', formattedDate);
            formData.append('jumlah', jumlah);

            // Fallback sekiranya Apps Script belum dideploy
            if(SCRIPT_URL === "SILA_GANTIKAN_DENGAN_WEB_APP_URL_ANDA") {
                showToast("Data dihantar terus ke WhatsApp (Mod Simulasi)...", true);
                setTimeout(() => {
                    bukaWhatsApp(nama, hari, formattedDate, jumlah);
                    resetForm();
                }, 1500);
                return;
            }

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if(result.status === 'success') {
                    showToast("Rekod disimpan dalam Sheet! Membuka WhatsApp...", true);
                    setTimeout(() => {
                        bukaWhatsApp(nama, hari, formattedDate, jumlah);
                        resetForm();
                    }, 1500);
                } else {
                    showToast("Gagal simpan ke Sheet: " + result.message, false);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "HANTAR REKOD & NOTIFIKASI";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast("Ralat sistem. Menghala terus ke WhatsApp...", false);
                setTimeout(() => {
                    bukaWhatsApp(nama, hari, formattedDate, jumlah);
                    resetForm();
                }, 1500);
            });
        });

        function bukaWhatsApp(nama, hari, tarikh, jumlah) {
            // Skrip teks seperti yang anda minta untuk dihantar ke kumpulan WhatsApp
            const text = `Nama : ${nama}\nHari : ${hari}\nTarikh : ${tarikh}\nJumlah RM : ${parseFloat(jumlah).toFixed(2)}`;
            const encodedText = encodeURIComponent(text);
            
            // Membuka WhatsApp dengan teks yang siap diisi (pre-filled text)
            window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
            
            // Membuka pautan kumpulan WhatsApp anda
            setTimeout(() => {
                window.open(WHATSAPP_GROUP_LINK, '_blank');
            }, 1200);
        }

        function resetForm() {
            form.reset();
            document.getElementById('tarikh').valueAsDate = new Date();
            document.getElementById('hari').value = hariArray[new Date().getDay()];
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>HANTAR REKOD & NOTIFIKASI</span>`;
        }
    </script>
</body>
</html>

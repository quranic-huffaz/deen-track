<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#080d1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Zikir Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════════════
   TOKEN SYSTEM
═══════════════════════════════════════════════ */
:root {
  --bg:         #080d1a;
  --bg-card:    #111827;
  --bg-card2:   #16202f;
  --border:     rgba(255,255,255,0.07);
  --border-hi:  rgba(255,255,255,0.13);
  --green:      #00d68f;
  --green-dim:  rgba(0,214,143,0.12);
  --green-glow: 0 0 22px rgba(0,214,143,0.28);
  --gold:       #f4c95d;
  --gold-dim:   rgba(244,201,93,0.1);
  --blue:       #4a9eff;
  --blue-dim:   rgba(74,158,255,0.12);
  --red:        #f87171;
  --red-dim:    rgba(248,113,113,0.12);
  --t1:         #f0f4ff;
  --t2:         #8899bb;
  --t3:         #3d4f70;
  --r-sm:       10px;
  --r-md:       16px;
  --r-lg:       22px;
  --r-xl:       32px;
  --font:       'Outfit', sans-serif;
  --font-serif: 'DM Serif Display', serif;
  --font-mono:  'DM Mono', monospace;
  --ease:       cubic-bezier(0.22,1,0.36,1);
  --safe-t:     env(safe-area-inset-top, 0px);
  --safe-b:     env(safe-area-inset-bottom, 0px);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { height:100%; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; color-scheme:dark; }
body {
  font-family:var(--font);
  background:var(--bg);
  color:var(--t1);
  height:100%;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* starfield */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 50% 65%, rgba(255,255,255,.2) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 90% 55%, rgba(255,255,255,.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,.15) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 40%, rgba(255,255,255,.18) 0%, transparent 100%);
  pointer-events:none; z-index:0;
}

/* ═══════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════ */
#app {
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  height:100dvh;
  max-width:480px; margin:0 auto;
}

/* ═══════════════════════════════════════════════
   BOTTOM TAB BAR
═══════════════════════════════════════════════ */
.tabbar {
  display:flex;
  background:rgba(10,14,28,0.95);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);
  flex-shrink:0;
  position:relative; z-index:20;
}
.tab-btn {
  flex:1; background:none; border:none;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:10px 0 8px;
  color:var(--t3); cursor:pointer;
  transition:color 0.2s ease;
  font-family:var(--font); font-size:0.6rem; font-weight:600;
  letter-spacing:0.08em; text-transform:uppercase;
}
.tab-btn svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform 0.2s var(--ease); }
.tab-btn.active { color:var(--green); }
.tab-btn.active svg { transform:translateY(-2px); }

/* ═══════════════════════════════════════════════
   SCROLL PAGES
═══════════════════════════════════════════════ */
.page {
  display:none; flex:1;
  overflow-y:auto; overflow-x:hidden;
  padding:0 14px;
  -webkit-overflow-scrolling:touch;
}
.page::-webkit-scrollbar { width:0; }
.page.active { display:block; }
.page-top { height:calc(var(--safe-t) + 14px); }
.page-bot { height:calc(90px + var(--safe-b)); }

/* ═══════════════════════════════════════════════
   CARDS (generic)
═══════════════════════════════════════════════ */
.card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:18px; margin-bottom:10px;
  position:relative; overflow:hidden;
  animation:fadeUp 0.4s var(--ease) both;
}
.card::after {
  content:'';
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}

.lbl {
  font-size:0.62rem; font-weight:700;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--t3); margin-bottom:4px;
}

/* ═══════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════ */
.btn-primary {
  width:100%; background:linear-gradient(135deg,#00d68f,#00a86b);
  border:none; border-radius:var(--r-md); color:#061210;
  font-family:var(--font); font-size:.9rem; font-weight:700;
  letter-spacing:.03em; padding:14px; cursor:pointer; transition:all .2s var(--ease);
}
.btn-primary:hover { box-shadow:var(--green-glow); }
.btn-primary:active { transform:scale(.98); }

.btn-ghost { flex:1; background:transparent; border:1px solid var(--border); border-radius:var(--r-md); color:var(--t2); font-family:var(--font); font-size:.88rem; font-weight:500; padding:12px; cursor:pointer; transition:all .2s; }
.btn-ghost:hover { border-color:var(--border-hi); color:var(--t1); }

.btn-danger { flex:1; background:var(--red-dim); border:1px solid rgba(248,113,113,.25); border-radius:var(--r-md); color:var(--red); font-family:var(--font); font-size:.88rem; font-weight:600; padding:12px; cursor:pointer; transition:all .2s; }
.btn-danger:hover { background:rgba(248,113,113,.2); }

/* ═══════════════════════════════════════════════
   MODALS / SHEETS
═══════════════════════════════════════════════ */
.modal-bg {
  position:fixed; inset:0; background:rgba(4,7,16,.88);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  display:flex; align-items:flex-end;
  padding:12px; padding-bottom:calc(12px + var(--safe-b));
  z-index:100; opacity:0; pointer-events:none; transition:opacity .28s ease;
}
.modal-bg.open { opacity:1; pointer-events:all; }
.modal {
  background:var(--bg-card); border:1px solid var(--border-hi);
  border-radius:var(--r-xl); padding:26px 22px 22px;
  width:100%; max-width:460px; margin:0 auto;
  transform:translateY(28px); transition:transform .32s var(--ease);
}
.modal-bg.open .modal { transform:translateY(0); }
.modal-title { font-family:var(--font-serif); font-size:1.35rem; color:var(--t1); margin-bottom:6px; }
.modal-sub { font-size:.8rem; color:var(--t2); line-height:1.5; margin-bottom:18px; }
.modal-actions { display:flex; gap:8px; margin-top:4px; }

@media (min-width:600px) {
  .modal-bg { align-items:center; }
}

/* ═══════════════════════════════════════════════
   FORM ELEMENTS
═══════════════════════════════════════════════ */
.zk-form-group { margin-bottom:14px; }
.zk-form-label {
  font-size:.66rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--t3); margin-bottom:7px; display:block;
}
.zk-form-select, .zk-form-input {
  width:100%; background:var(--bg-card2); border:1px solid var(--border);
  border-radius:var(--r-md); color:var(--t1); font-family:var(--font);
  font-size:.92rem; padding:12px 14px; outline:none;
  transition:border-color .2s;
}
.zk-form-select:focus, .zk-form-input:focus { border-color:var(--green); }
.zk-form-error {
  font-size:.68rem; color:var(--red); margin-top:6px; min-height:14px;
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
#toast {
  position:fixed; bottom:calc(72px + var(--safe-b)); left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--bg-card); border:1px solid var(--border-hi);
  border-radius:99px; padding:9px 18px; font-size:.8rem; color:var(--t1);
  white-space:nowrap; z-index:200; pointer-events:none; opacity:0;
  box-shadow:0 6px 28px rgba(0,0,0,.55); transition:transform .32s var(--ease), opacity .32s;
}
#toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

/* ═══════════════════════════════════════════════
   DESKTOP RESPONSIVE
═══════════════════════════════════════════════ */
@media (min-width:600px) {
  #app { border-left:1px solid var(--border); border-right:1px solid var(--border); box-shadow:0 0 60px rgba(0,0,0,.5); }
}
@media (min-width:900px) {
  body { background:#04070f; }
  body::before {
    background-image:
      radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 65%, rgba(255,255,255,.2) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(255,255,255,.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 40%, rgba(255,255,255,.18) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 75%, rgba(255,255,255,.12) 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 30%, rgba(255,255,255,.1) 0%, transparent 100%);
  }
}

/* ═══════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════ */
.zk-header { padding:4px 2px 16px; animation:fadeUp .4s var(--ease) both; }
.zk-header-title {
  font-family:var(--font-serif); font-size:1.55rem; color:var(--t1); letter-spacing:.02em;
}
.zk-header-sub { font-size:.72rem; color:var(--t3); margin-top:5px; letter-spacing:.02em; }

/* ═══════════════════════════════════════════════
   SUMMARY CARDS (Dashboard, locked)
═══════════════════════════════════════════════ */
.zk-summary-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:16px 18px; margin-bottom:10px; position:relative; overflow:hidden;
  animation:fadeUp .4s var(--ease) both;
}
.zk-summary-card::after {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
}
.zk-summary-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.zk-summary-icon {
  width:38px; height:38px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.zk-summary-icon svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.zk-accent-green .zk-summary-icon { background:var(--green-dim); border:1px solid rgba(0,214,143,.25); color:var(--green); }
.zk-accent-blue  .zk-summary-icon { background:var(--blue-dim);  border:1px solid rgba(74,158,255,.25); color:var(--blue); }
.zk-accent-gold  .zk-summary-icon { background:var(--gold-dim);  border:1px solid rgba(244,201,93,.3);  color:var(--gold); }
.zk-summary-name { font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--t2); }
.zk-summary-meta { font-size:.63rem; color:var(--t3); margin-top:3px; }
.zk-summary-total { font-family:var(--font-mono); font-size:1.95rem; font-weight:600; color:var(--t1); line-height:1; }
.zk-accent-green .zk-summary-total { color:var(--green); }
.zk-accent-blue  .zk-summary-total { color:var(--blue); }
.zk-accent-gold  .zk-summary-total { color:var(--gold); }
.zk-summary-total-lbl { font-size:.6rem; color:var(--t3); margin-top:5px; text-transform:uppercase; letter-spacing:.08em; }
.zk-lock-note {
  position:absolute; top:14px; right:16px; display:flex; align-items:center; gap:4px;
  font-size:.56rem; color:var(--t3); letter-spacing:.05em;
}
.zk-lock-note svg { width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2; }

/* ═══════════════════════════════════════════════
   HARI INI CARD
═══════════════════════════════════════════════ */
.zk-today-card {
  position:relative; overflow:hidden;
  background:linear-gradient(140deg,#0d1e3a 0%,#080d1a 100%);
  border:1px solid rgba(74,158,255,.18);
  border-radius:var(--r-lg); padding:18px 18px 18px; margin:4px 0 14px;
  animation:fadeUp .4s var(--ease) both;
}
.zk-today-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(74,158,255,.4), transparent);
}
.zk-today-lbl { font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--t3); margin-bottom:7px; }
.zk-today-date { font-family:var(--font-serif); font-size:1.2rem; color:var(--t1); }
.zk-today-day { font-size:.74rem; color:var(--t2); margin-top:3px; margin-bottom:16px; }
.zk-today-btn {
  display:inline-flex; align-items:center; gap:7px;
  background:var(--blue-dim); border:1px solid rgba(74,158,255,.3);
  color:var(--blue); font-family:var(--font); font-weight:600; font-size:.78rem;
  letter-spacing:.02em; padding:10px 18px; border-radius:99px; cursor:pointer;
  transition:all .22s var(--ease);
}
.zk-today-btn svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .22s var(--ease); }
.zk-today-btn:hover { background:rgba(74,158,255,.2); box-shadow:0 0 18px rgba(74,158,255,.25); }
.zk-today-btn:hover svg { transform:translateY(2px); }
.zk-today-btn:active { transform:scale(.97); }

/* ═══════════════════════════════════════════════
   SECTION TITLE + MONTH NAV
═══════════════════════════════════════════════ */
.zk-section-title { font-family:var(--font-serif); font-size:1.05rem; color:var(--t1); margin:2px 2px 10px; }

.jtl-month-row {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px; animation:fadeUp 0.4s var(--ease) both; animation-delay:.12s;
}
.jtl-month-title { font-family:var(--font-serif); font-size:1rem; color:var(--t1); }
.jtl-month-nav { display:flex; align-items:center; gap:8px; }
.jtl-nav-btn {
  width:30px; height:30px; border-radius:50%;
  background:var(--bg-card2); border:1px solid var(--border);
  color:var(--t2); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:.8rem; transition:all .2s;
}
.jtl-nav-btn:hover:not(:disabled) { border-color:var(--green); color:var(--green); background:var(--green-dim); }
.jtl-nav-btn:disabled { opacity:.3; cursor:default; }

/* ═══════════════════════════════════════════════
   KALENDAR ZIKIR (per-day cards)
═══════════════════════════════════════════════ */
.zk-cal-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:14px 16px; margin-bottom:10px; animation:fadeUp .35s var(--ease) both;
  scroll-margin-top:16px;
}
.zk-cal-card.is-today { border-color:rgba(74,158,255,.3); background:linear-gradient(135deg, rgba(74,158,255,.05), var(--bg-card) 60%); }
.zk-cal-date-row { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.zk-cal-date-num { font-family:var(--font-mono); font-size:.95rem; font-weight:600; color:var(--t1); }
.zk-cal-card.is-today .zk-cal-date-num { color:var(--blue); }
.zk-cal-date-day { font-size:.66rem; color:var(--t3); }
.zk-cal-today-tag {
  margin-left:auto; font-size:.56rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--blue); background:var(--blue-dim); border:1px solid rgba(74,158,255,.25);
  border-radius:99px; padding:2px 8px;
}
.zk-cal-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; gap:10px; }
.zk-cal-row + .zk-cal-row { border-top:1px solid rgba(255,255,255,.04); }
.zk-cal-row-name { font-size:.76rem; color:var(--t2); font-weight:500; flex-shrink:0; }
.zk-cal-row-vals { display:flex; gap:14px; align-items:center; }
.zk-badge { display:flex; flex-direction:column; align-items:flex-end; min-width:52px; }
.zk-badge-lbl { font-size:.52rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--t3); }
.zk-badge-val { font-family:var(--font-mono); font-size:.8rem; font-weight:600; color:var(--t1); margin-top:1px; }
.zk-badge.rekod .zk-badge-val { color:var(--green); }
.zk-badge.rekod.empty .zk-badge-val, .zk-badge.notstarted .zk-badge-val {
  color:var(--t3); font-family:var(--font); font-weight:500; font-size:.64rem;
}

/* ═══════════════════════════════════════════════
   REKOD PAGE
═══════════════════════════════════════════════ */
.zk-mini-row { display:flex; gap:8px; margin-bottom:16px; }
.zk-mini-card {
  flex:1; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-md);
  padding:13px 8px; text-align:center; animation:fadeUp .4s var(--ease) both;
}
.zk-mini-name { font-size:.54rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--t3); margin-bottom:7px; }
.zk-mini-val { font-family:var(--font-mono); font-size:1.1rem; font-weight:600; color:var(--t1); }

.zk-rec-group-lbl {
  font-size:.7rem; font-weight:700; letter-spacing:.05em; color:var(--t2);
  margin:18px 2px 8px; display:flex; align-items:center; gap:8px;
}
.zk-rec-group-lbl:first-child { margin-top:0; }
.zk-rec-item {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-md);
  padding:13px 14px; margin-bottom:8px; animation:fadeUp .35s var(--ease) both;
}
.zk-rec-left { display:flex; flex-direction:column; gap:3px; }
.zk-rec-name { font-size:.84rem; font-weight:600; color:var(--t1); }
.zk-rec-amt { font-family:var(--font-mono); font-size:.74rem; color:var(--green); }
.zk-rec-actions { display:flex; gap:6px; flex-shrink:0; }
.zk-rec-btn {
  width:30px; height:30px; border-radius:9px; background:var(--bg-card2); border:1px solid var(--border);
  color:var(--t2); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s;
}
.zk-rec-btn svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.zk-rec-btn:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-dim); }
.zk-rec-btn.del:hover { border-color:var(--red); color:var(--red); background:var(--red-dim); }

/* ═══════════════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════════════ */
.zk-empty { text-align:center; padding:60px 24px; animation:fadeUp .4s var(--ease) both; }
.zk-empty-icon {
  width:52px; height:52px; margin:0 auto 14px; border-radius:16px;
  background:var(--green-dim); border:1px solid rgba(0,214,143,.22);
  display:flex; align-items:center; justify-content:center; color:var(--green);
}
.zk-empty-icon svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.zk-empty-title { font-size:.95rem; font-weight:600; color:var(--t2); margin-bottom:6px; }
.zk-empty-sub { font-size:.76rem; color:var(--t3); line-height:1.5; }

/* ═══════════════════════════════════════════════
   FLOATING ACTION BUTTON (tab Rekod)
═══════════════════════════════════════════════ */
.fab {
  position:absolute; right:18px; bottom:calc(88px + var(--safe-b));
  width:56px; height:56px; border-radius:50%;
  background:linear-gradient(135deg,#00d68f,#00a86b); border:none;
  color:#061210; display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:30; transition:all .25s var(--ease);
  box-shadow:0 8px 26px rgba(0,214,143,.35);
  opacity:0; pointer-events:none; transform:scale(.7);
}
.fab.show { opacity:1; pointer-events:all; transform:scale(1); }

<script>
'use strict';

/* ═══════════════════════════════════════════════
   CONFIG — LOCKED. Jangan sediakan UI untuk edit ini.
   (Key dalaman "pendinding" dikekalkan; hanya label paparan
   ditukar kepada "Bacaan Ruqyah" supaya struktur data asal
   tidak terjejas.)
═══════════════════════════════════════════════ */
const ZIKIR_CONFIG = {
  istighfar:  { name: 'Istighfar',        dailyTarget: 1000, startDate: '2026-09-01', accent: 'green' },
  selawat:    { name: 'Selawat',          dailyTarget: 1000, startDate: '2026-09-01', accent: 'blue'  },
  pendinding: { name: 'Bacaan Ruqyah',    dailyTarget: 20,   startDate: '2026-09-13', accent: 'gold'  }
};
const ZIKIR_ORDER = ['istighfar', 'selawat', 'pendinding'];

const ICONS = {
  istighfar:  '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  selawat:    '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  pendinding: '<svg viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v6c0 5.2 3.4 8.9 7.5 10 4.1-1.1 7.5-4.8 7.5-10v-6z"/></svg>'
};

const MONTH_NAMES = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const DAY_NAMES = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];

const STORAGE_KEY = 'zikirTrackerRecords_v1';

/* ═══════════════════════════════════════════════
   GOOGLE SHEETS INTEGRATION
   ---------------------------------------------------------
   1. Deploy skrip "Code.gs" (disediakan berasingan) sebagai
      Google Apps Script Web App: Deploy > New deployment >
      Type: Web app > Execute as: Me > Who has access: Anyone.
   2. Salin URL Web App yang dihasilkan (bermula dengan
      https://script.google.com/macros/s/.../exec).
   3. Tampal URL tersebut di dalam GOOGLE_SHEET_API_URL di
      bawah, di antara tanda petikan ''.
   4. Jika medan ini dibiarkan kosong (''), aplikasi akan
      terus berfungsi sepenuhnya menggunakan localStorage
      sahaja — tiada ralat akan berlaku.
   ---------------------------------------------------------
═══════════════════════════════════════════════ */
const GOOGLE_SHEET_API_URL = ''; // <-- MASUKKAN URL WEB APP GOOGLE APPS SCRIPT DI SINI

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let state = {
  records: [],       // rekod manual daripada localStorage
  editingId: null,   // id rekod yang sedang diedit (null = mod tambah baru)
  deletingId: null,  // id rekod yang menunggu pengesahan padam
  viewYear: null,
  viewMonth: null    // 0-11
};

/* ═══════════════════════════════════════════════
   LOCAL STORAGE
═══════════════════════════════════════════════ */
function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.error('Gagal membaca rekod:', e);
    return [];
  }
}

function saveRecords(records) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    return true;
  } catch (e) {
    console.error('Gagal menyimpan rekod:', e);
    return false;
  }
}

/* ═══════════════════════════════════════════════
   GOOGLE SHEET SYNC (fire-and-forget, tidak sekat UI)
═══════════════════════════════════════════════ */
function syncRecordToSheet(record, action) {
  if (!GOOGLE_SHEET_API_URL) return; // endpoint belum dikonfigurasikan — guna localStorage sahaja

  const payload = {
    id: record.id,
    zikir: record.zikir,
    jumlah: record.jumlah,
    tarikh: record.tarikh,
    createdAt: record.createdAt || '',
    updatedAt: record.updatedAt || '',
    action: action // 'create' | 'update' | 'delete'
  };

  try {
    fetch(GOOGLE_SHEET_API_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script tidak selalu hantar header CORS; ini elak fetch gagal
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).catch(function (err) {
      console.warn('Segerak Google Sheet gagal (data selamat di localStorage):', err);
    });
  } catch (err) {
    // Jangan biarkan sebarang ralat di sini menjejaskan aplikasi
    console.warn('Ralat semasa cuba segerak Google Sheet:', err);
  }
}

/* ═══════════════════════════════════════════════
   DATE FUNCTIONS (selamat, elak isu timezone)
═══════════════════════════════════════════════ */
function pad2(n) { return String(n).padStart(2, '0'); }

function toISO(dateObj) {
  return dateObj.getFullYear() + '-' + pad2(dateObj.getMonth() + 1) + '-' + pad2(dateObj.getDate());
}

function parseISO(iso) {
  const parts = iso.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function todayISO() {
  return toISO(new Date());
}

function diffDaysInclusive(startISO, endISO) {
  const s = parseISO(startISO);
  const e = parseISO(endISO);
  if (e < s) return 0;
  return Math.round((e - s) / 86400000) + 1;
}

function formatDateMY(iso) {
  const d = parseISO(iso);
  return d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
}

function dayNameMY(iso) {
  const d = parseISO(iso);
  return DAY_NAMES[d.getDay()];
}

function fmt(n) {
  return Math.round(n).toLocaleString('en-US');
}

/* ═══════════════════════════════════════════════
   KIRAAN TARGET (automatik, locked)
═══════════════════════════════════════════════ */
function cumulativeTarget(key, dateISO) {
  const cfg = ZIKIR_CONFIG[key];
  if (dateISO < cfg.startDate) return null; // belum bermula pada tarikh ini
  return diffDaysInclusive(cfg.startDate, dateISO) * cfg.dailyTarget;
}

function earliestStartDate() {
  return ZIKIR_ORDER.reduce((min, key) => {
    return ZIKIR_CONFIG[key].startDate < min ? ZIKIR_CONFIG[key].startDate : min;
  }, ZIKIR_CONFIG[ZIKIR_ORDER[0]].startDate);
}

/* ═══════════════════════════════════════════════
   REKOD MANUAL — helper
═══════════════════════════════════════════════ */
function recordsForDate(key, dateISO) {
  return state.records.filter(r => r.zikir === key && r.tarikh === dateISO);
}

function sumRecordsForDate(key, dateISO) {
  const list = recordsForDate(key, dateISO);
  if (list.length === 0) return null; // belum direkod
  return list.reduce((sum, r) => sum + r.jumlah, 0);
}

function sumRecordsAll(key) {
  return state.records
    .filter(r => r.zikir === key)
    .reduce((sum, r) => sum + r.jumlah, 0);
}

function genId() {
  return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

/* ═══════════════════════════════════════════════
   DASHBOARD RENDER
═══════════════════════════════════════════════ */
function renderSummaryCards() {
  const today = todayISO();
  const wrap = $('summary-cards');
  let html = '';
  ZIKIR_ORDER.forEach((key, idx) => {
    const cfg = ZIKIR_CONFIG[key];
    const total = cumulativeTarget(key, today) || 0;
    html += `
      <div class="zk-summary-card zk-accent-${cfg.accent}" style="animation-delay:${(idx * 0.04 + 0.02).toFixed(2)}s">
        <div class="zk-lock-note" title="Dikunci - tidak boleh diedit">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </div>
        <div class="zk-summary-top">
          <div class="zk-summary-icon">${ICONS[key]}</div>
          <div>
            <div class="zk-summary-name">${escapeHtml(cfg.name)}</div>
            <div class="zk-summary-meta">${fmt(cfg.dailyTarget)} / hari &middot; Bermula ${formatDateMY(cfg.startDate)}</div>
          </div>
        </div>
        <div class="zk-summary-total">${fmt(total)}</div>
        <div class="zk-summary-total-lbl">Jumlah terkumpul</div>
      </div>`;
  });
  wrap.innerHTML = html;
}

function renderHariIni() {
  const today = todayISO();
  $('today-date').textContent = formatDateMY(today);
  $('today-day').textContent = dayNameMY(today);
}

function renderCalendar() {
  const today = todayISO();
  const earliest = earliestStartDate();
  const earliestD = parseISO(earliest);
  const todayD = parseISO(today);

  // Clamp viewYear/viewMonth supaya tidak melangkaui had
  const minYM = earliestD.getFullYear() * 12 + earliestD.getMonth();
  const maxYM = todayD.getFullYear() * 12 + todayD.getMonth();
  let curYM = state.viewYear * 12 + state.viewMonth;
  if (curYM < minYM) { state.viewYear = earliestD.getFullYear(); state.viewMonth = earliestD.getMonth(); }
  if (curYM > maxYM) { state.viewYear = todayD.getFullYear(); state.viewMonth = todayD.getMonth(); }
  curYM = state.viewYear * 12 + state.viewMonth;

  $('cal-month-title').textContent = MONTH_NAMES[state.viewMonth] + ' ' + state.viewYear;
  $('cal-prev').disabled = (curYM <= minYM);
  $('cal-next').disabled = (curYM >= maxYM);

  // Julat hari dalam bulan yang dipaparkan, dipotong pada earliest & today
  const firstOfMonth = new Date(state.viewYear, state.viewMonth, 1);
  const lastOfMonth = new Date(state.viewYear, state.viewMonth + 1, 0);
  const rangeStart = firstOfMonth < earliestD ? earliestD : firstOfMonth;
  const rangeEnd = lastOfMonth > todayD ? todayD : lastOfMonth;

  let html = '';
  if (rangeStart > rangeEnd) {
    html = `<div class="zk-empty"><div class="zk-empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div class="zk-empty-title">Tiada Data</div><div class="zk-empty-sub">Belum ada tarikh amalan pada bulan ini.</div></div>`;
  } else {
    const cur = new Date(rangeStart);
    while (cur <= rangeEnd) {
      const iso = toISO(cur);
      const isToday = (iso === today);
      let rows = '';
      ZIKIR_ORDER.forEach(key => {
        const cfg = ZIKIR_CONFIG[key];
        if (iso < cfg.startDate) {
          rows += `
            <div class="zk-cal-row">
              <div class="zk-cal-row-name">${escapeHtml(cfg.name)}</div>
              <div class="zk-cal-row-vals">
                <div class="zk-badge notstarted"><span class="zk-badge-lbl">Status</span><span class="zk-badge-val">Belum Bermula</span></div>
              </div>
            </div>`;
        } else {
          const target = cumulativeTarget(key, iso);
          const rekod = sumRecordsForDate(key, iso);
          rows += `
            <div class="zk-cal-row">
              <div class="zk-cal-row-name">${escapeHtml(cfg.name)}</div>
              <div class="zk-cal-row-vals">
                <div class="zk-badge target"><span class="zk-badge-lbl">Target</span><span class="zk-badge-val">${fmt(target)}</span></div>
                <div class="zk-badge rekod${rekod === null ? ' empty' : ''}"><span class="zk-badge-lbl">Rekod</span><span class="zk-badge-val">${rekod === null ? 'Belum direkod' : fmt(rekod)}</span></div>
              </div>
            </div>`;
        }
      });
      html += `
        <div class="zk-cal-card${isToday ? ' is-today' : ''}" id="cal-day-${iso}">
          <div class="zk-cal-date-row">
            <span class="zk-cal-date-num">${formatDateMY(iso)}</span>
            <span class="zk-cal-date-day">${dayNameMY(iso)}</span>
            ${isToday ? '<span class="zk-cal-today-tag">Hari Ini</span>' : ''}
          </div>
          ${rows}
        </div>`;
      cur.setDate(cur.getDate() + 1);
    }
  }
  $('cal-list').innerHTML = html;
}

function renderDashboard() {
  renderSummaryCards();
  renderHariIni();
  renderCalendar();
  updateScrollArrow();
}

/* ═══════════════════════════════════════════════
   REKOD PAGE RENDER
═══════════════════════════════════════════════ */
function renderRecordSummary() {
  let html = '';
  ZIKIR_ORDER.forEach(key => {
    const cfg = ZIKIR_CONFIG[key];
    html += `
      <div class="zk-mini-card">
        <div class="zk-mini-name">${escapeHtml(cfg.name)}</div>
        <div class="zk-mini-val">${fmt(sumRecordsAll(key))}</div>
      </div>`;
  });
  $('rec-summary').innerHTML = html;
}

function renderRecordList() {
  const wrap = $('rec-list');
  if (state.records.length === 0) {
    wrap.innerHTML = `
      <div class="zk-empty">
        <div class="zk-empty-icon"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
        <div class="zk-empty-title">Belum Ada Rekod</div>
        <div class="zk-empty-sub">Tekan butang + untuk merekod amalan anda.</div>
      </div>`;
    return;
  }

  // Kumpul mengikut tarikh, susun terbaru dahulu
  const byDate = {};
  state.records.forEach(r => {
    if (!byDate[r.tarikh]) byDate[r.tarikh] = [];
    byDate[r.tarikh].push(r);
  });
  const dates = Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1));

  let html = '';
  dates.forEach(dateISO => {
    html += `<div class="zk-rec-group-lbl">${formatDateMY(dateISO)} &middot; ${dayNameMY(dateISO)}</div>`;
    const entries = byDate[dateISO].slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    entries.forEach(r => {
      const cfg = ZIKIR_CONFIG[r.zikir] || { name: r.zikir };
      html += `
        <div class="zk-rec-item">
          <div class="zk-rec-left">
            <span class="zk-rec-name">${escapeHtml(cfg.name)}</span>
            <span class="zk-rec-amt">+${fmt(r.jumlah)} kali</span>
          </div>
          <div class="zk-rec-actions">
            <button class="zk-rec-btn" data-edit="${r.id}" aria-label="Edit rekod">
              <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="zk-rec-btn del" data-delete="${r.id}" aria-label="Padam rekod">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </button>
          </div>
        </div>`;
    });
  });
  wrap.innerHTML = html;

  // Attach events (delegation lebih baik, tapi list kecil jadi ini cukup)
  wrap.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => openRecordModal(btn.getAttribute('data-edit')));
  });
  wrap.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => openDeleteModal(btn.getAttribute('data-delete')));
  });
}

function renderRekodPage() {
  renderRecordSummary();
  renderRecordList();
}

/* ═══════════════════════════════════════════════
   MODALS
═══════════════════════════════════════════════ */
function openModal(el) { el.classList.add('open'); }
function closeModal(el) { el.classList.remove('open'); }

function openRecordModal(editId) {
  clearFormError();
  if (editId) {
    const rec = state.records.find(r => r.id === editId);
    if (!rec) return;
    state.editingId = editId;
    $('record-modal-title').textContent = 'Kemaskini Rekod Zikir';
    $('record-modal-sub').textContent = 'Kemaskini jumlah amalan yang telah dilakukan.';
    $('f-zikir').value = rec.zikir;
    $('f-jumlah').value = rec.jumlah;
    $('f-tarikh').value = rec.tarikh;
  } else {
    state.editingId = null;
    $('record-modal-title').textContent = 'Tambah Rekod Zikir';
    $('record-modal-sub').textContent = 'Masukkan jumlah amalan yang telah dilakukan.';
    $('f-zikir').value = 'istighfar';
    $('f-jumlah').value = '';
    $('f-tarikh').value = todayISO();
  }
  $('f-tarikh').max = todayISO();
  openModal($('modal-record'));
  setTimeout(() => $('f-jumlah').focus(), 250);
}

function clearFormError() { $('f-error').textContent = ''; }

function saveRecordFromForm() {
  const zikir = $('f-zikir').value;
  const jumlahRaw = $('f-jumlah').value;
  const tarikh = $('f-tarikh').value;

  const jumlah = parseInt(jumlahRaw, 10);

  if (!ZIKIR_CONFIG[zikir]) { showFormError('Nama zikir tidak sah.'); return; }
  if (isNaN(jumlah) || !Number.isInteger(jumlah) || jumlah <= 0 || String(jumlahRaw).indexOf('.') !== -1) {
    showFormError('Jumlah mesti nombor bulat lebih besar daripada 0.');
    return;
  }
  if (!tarikh || isNaN(parseISO(tarikh).getTime())) { showFormError('Tarikh tidak sah.'); return; }
  if (tarikh > todayISO()) { showFormError('Tarikh tidak boleh melebihi hari ini.'); return; }

  if (state.editingId) {
    const rec = state.records.find(r => r.id === state.editingId);
    if (rec) {
      rec.zikir = zikir; rec.jumlah = jumlah; rec.tarikh = tarikh;
      rec.updatedAt = new Date().toISOString();
      saveRecords(state.records);
      syncRecordToSheet(rec, 'update');
    }
    closeModal($('modal-record'));
    toast('Rekod berjaya dikemaskini');
  } else {
    const newRec = {
      id: genId(), zikir, jumlah, tarikh,
      createdAt: new Date().toISOString(),
      updatedAt: ''
    };
    state.records.push(newRec);
    saveRecords(state.records);
    syncRecordToSheet(newRec, 'create');
    closeModal($('modal-record'));
    toast('Rekod berjaya disimpan');
  }
  renderDashboard();
  renderRekodPage();
}

function showFormError(msg) { $('f-error').textContent = msg; }

function openDeleteModal(id) {
  state.deletingId = id;
  openModal($('modal-delete'));
}

function confirmDelete() {
  if (!state.deletingId) return;
  const rec = state.records.find(r => r.id === state.deletingId);
  state.records = state.records.filter(r => r.id !== state.deletingId);
  saveRecords(state.records);
  if (rec) {
    rec.updatedAt = new Date().toISOString();
    syncRecordToSheet(rec, 'delete');
  }
  state.deletingId = null;
  closeModal($('modal-delete'));
  toast('Rekod telah dipadam');
  renderDashboard();
  renderRekodPage();
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ═══════════════════════════════════════════════
   SCROLL-TO-BOTTOM ARROW (Dashboard)
═══════════════════════════════════════════════ */
function updateScrollArrow() {
  const btn = $('scroll-arrow');
  const page = $('pg-dashboard');
  if (!page.classList.contains('active')) {
    btn.classList.remove('show');
    return;
  }
  const distanceToBottom = page.scrollHeight - page.scrollTop - page.clientHeight;
  const needsScroll = page.scrollHeight > page.clientHeight + 30;
  btn.classList.toggle('show', needsScroll && distanceToBottom > 40);
}

function scrollDashboardToBottom() {
  const page = $('pg-dashboard');
  page.scrollTo({ top: page.scrollHeight, behavior: 'smooth' });
}

/* ═══════════════════════════════════════════════
   "LIHAT" — SCROLL AUTO KE TARIKH HARI INI
═══════════════════════════════════════════════ */
function scrollToToday() {
  const todayD = new Date();
  state.viewYear = todayD.getFullYear();
  state.viewMonth = todayD.getMonth();
  renderCalendar();
  requestAnimationFrame(() => {
    const el = document.getElementById('cal-day-' + todayISO());
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    setTimeout(updateScrollArrow, 450);
  });
}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
const TABS = {
  dashboard: { btn: null, page: null },
  rekod:     { btn: null, page: null }
};

function initTabs() {
  TABS.dashboard.page = $('pg-dashboard');
  TABS.rekod.page = $('pg-rekod');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const key = btn.getAttribute('data-tab');
    if (TABS[key]) TABS[key].btn = btn;
    btn.addEventListener('click', () => switchTab(key));
  });
}

function switchTab(key) {
  Object.entries(TABS).forEach(([k, t]) => {
    if (!t.btn || !t.page) return;
    t.btn.classList.toggle('active', k === key);
    t.page.classList.toggle('active', k === key);
  });
  $('fab-add').classList.toggle('show', key === 'rekod');
  if (key === 'dashboard') {
    setTimeout(updateScrollArrow, 60);
  } else {
    $('scroll-arrow').classList.remove('show');
  }
}

/* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
function $(id) { return document.getElementById(id); }
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ═══════════════════════════════════════════════
   AUTO-REFRESH APABILA TARIKH BERTUKAR
═══════════════════════════════════════════════ */
let lastKnownDate = todayISO();
function checkDateChange() {
  const now = todayISO();
  if (now !== lastKnownDate) {
    lastKnownDate = now;
    state.viewYear = parseISO(now).getFullYear();
    state.viewMonth = parseISO(now).getMonth();
    renderDashboard();
    renderRekodPage();
  }
}
setInterval(checkDateChange, 60000);

/* ═══════════════════════════════════════════════
   EVENTS
═══════════════════════════════════════════════ */
function bindEvents() {
  $('cal-prev').addEventListener('click', () => {
    state.viewMonth--;
    if (state.viewMonth < 0) { state.viewMonth = 11; state.viewYear--; }
    renderCalendar();
    setTimeout(updateScrollArrow, 60);
  });
  $('cal-next').addEventListener('click', () => {
    state.viewMonth++;
    if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
    renderCalendar();
    setTimeout(updateScrollArrow, 60);
  });

  $('today-view-btn').addEventListener('click', scrollToToday);
  $('scroll-arrow').addEventListener('click', scrollDashboardToBottom);
  $('pg-dashboard').addEventListener('scroll', updateScrollArrow);
  window.addEventListener('resize', () => setTimeout(updateScrollArrow, 60));

  $('fab-add').addEventListener('click', () => openRecordModal(null));
  $('record-cancel').addEventListener('click', () => closeModal($('modal-record')));
  $('record-save').addEventListener('click', saveRecordFromForm);
  $('modal-record').addEventListener('click', e => { if (e.target === $('modal-record')) closeModal($('modal-record')); });

  $('delete-cancel').addEventListener('click', () => { state.deletingId = null; closeModal($('modal-delete')); });
  $('delete-confirm').addEventListener('click', confirmDelete);
  $('modal-delete').addEventListener('click', e => { if (e.target === $('modal-delete')) { state.deletingId = null; closeModal($('modal-delete')); } });

  $('f-jumlah').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('record-save').click(); } });
  [$('f-zikir'), $('f-jumlah'), $('f-tarikh')].forEach(el => el.addEventListener('input', clearFormError));
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
function init() {
  state.records = loadRecords();
  const today = new Date();
  state.viewYear = today.getFullYear();
  state.viewMonth = today.getMonth();

  initTabs();
  bindEvents();
  renderDashboard();
  renderRekodPage();

  console.log('%c✓ Zikir Tracker — dimuatkan', 'color:#00d68f;font-size:12px;font-weight:bold');
}

document.readyState === 'loading'
  ? document.addEventListener('DOMContentLoaded', init)
  : init();
</script>
</body>

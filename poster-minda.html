<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vault — Peta Minda Ilmu</title>
<meta name="description" content="Platform arkib peta minda tersusun mengikut subjek dan tajuk.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:            #0a0c10;
    --bg-soft:       #0d1016;
    --surface:       #12151c;
    --surface-hover: #191d26;
    --border:        #232833;
    --border-soft:   #1a1e27;
    --text:          #edeef0;
    --text-muted:    #8b93a1;
    --text-faint:    #4d5561;
    --gold:          #c9a227;
    --gold-bright:   #e4c558;
    --teal:          #2f8f86;
    --teal-dim:      #1b4d4a;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.55);
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 520px at 82% -8%, rgba(201,162,39,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(47,143,134,.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;}
  ::selection{background:rgba(201,162,39,.28); color:#fff;}
  :focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px; border-radius:6px;}
  img{-webkit-user-drag:none; user-select:none;}
  button{font-family:inherit;}

  a{color:inherit;text-decoration:none;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:20px;
    padding:16px 28px;
    background:rgba(10,12,16,.72);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(150deg,var(--gold-bright),var(--gold) 55%,var(--teal-dim));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px -4px rgba(201,162,39,.5);
    flex-shrink:0;
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-word{font-size:17px; font-weight:700; letter-spacing:-.01em;}
  .brand-word span{color:var(--gold-bright); font-weight:500;}

  .searchbar{
    flex:1; max-width:560px; position:relative;
    display:flex; align-items:center;
  }
  .searchbar svg{position:absolute; left:14px; width:16px; height:16px; color:var(--text-faint); pointer-events:none;}
  .searchbar input{
    width:100%; padding:11px 14px 11px 40px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-size:14px;
    transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  .searchbar input::placeholder{color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .searchbar input:focus{border-color:var(--gold); background:var(--surface-hover);}
  .searchbar .kbd{
    position:absolute; right:10px; font-size:11px; color:var(--text-faint);
    border:1px solid var(--border); border-radius:5px; padding:2px 6px;
    font-family:'IBM Plex Mono',monospace; pointer-events:none;
  }

  .topbar-right{margin-left:auto; display:flex; align-items:center; gap:14px; flex-shrink:0;}
  .owner-pill{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-muted);
    border:1px solid var(--border); border-radius:100px; padding:6px 12px 6px 6px;
    white-space:nowrap;
  }
  .owner-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(47,143,134,.18);}

  /* ---------- Breadcrumb ticker ---------- */
  .ticker{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:16px 28px 4px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    color:var(--text-muted); max-width:1240px; margin:0 auto;
  }
  .ticker button{
    background:none;border:none;color:var(--text-muted);cursor:pointer;padding:3px 2px;
    transition:color .15s;
  }
  .ticker button:hover, .ticker .current{color:var(--gold-bright);}
  .ticker .sep{color:var(--text-faint);}

  /* ---------- Main ---------- */
  main{max-width:1240px; margin:0 auto; padding:18px 28px 90px;}

  .hero-line{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    margin:10px 0 26px; flex-wrap:wrap;
  }
  .hero-line h1{font-size:26px; margin:0 0 4px; letter-spacing:-.01em;}
  .hero-line p{margin:0; color:var(--text-muted); font-size:14.5px;}
  .count-badge{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold-bright);
    border:1px solid rgba(201,162,39,.35); background:rgba(201,162,39,.06);
    padding:6px 12px; border-radius:100px; white-space:nowrap;
  }

  /* ---------- Grid & cards ---------- */
  .grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
  .grid.titles{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
  .grid.posters{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px;
    cursor:pointer;
    transition:transform .22s var(--ease), border-color .22s var(--ease), background .22s var(--ease), box-shadow .22s var(--ease);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .card::after{
    content:""; position:absolute; inset:0; opacity:0; pointer-events:none;
    background:linear-gradient(160deg, rgba(201,162,39,.10), transparent 55%);
    transition:opacity .25s var(--ease);
  }
  .card:hover{transform:translateY(-3px); border-color:rgba(201,162,39,.4); background:var(--surface-hover);}
  .card:hover::after{opacity:1;}

  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .card-icon{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(155deg, var(--teal-dim), rgba(255,255,255,.02));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--gold-bright);
  }
  .card-icon svg{width:20px;height:20px;}
  .code-pill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold-bright);
    border:1px solid rgba(201,162,39,.3); border-radius:6px; padding:3px 7px;
    background:rgba(201,162,39,.05); flex-shrink:0;
  }
  .card h3{margin:0 0 6px; font-size:16.5px; letter-spacing:-.005em;}
  .card p.desc{margin:0 0 16px; font-size:13px; color:var(--text-muted); line-height:1.5; min-height:20px;}
  .card-foot{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-faint);}
  .card-foot .stat{font-family:'IBM Plex Mono',monospace; color:var(--text-muted);}
  .card-foot .arrow{color:var(--gold-bright); opacity:0; transform:translateX(-4px); transition:all .2s var(--ease);}
  .card:hover .card-foot .arrow{opacity:1; transform:translateX(0);}

  /* poster thumb card */
  .poster-card{padding:0; display:flex; flex-direction:column;}
  .poster-thumb{
    aspect-ratio:4/3; width:100%; border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    background:
      linear-gradient(155deg, rgba(201,162,39,.14), rgba(47,143,134,.10)),
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .poster-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .poster-thumb .fallback-icon{color:rgba(228,197,88,.35); width:34px; height:34px;}
  .poster-thumb .code-pill{position:absolute; top:10px; right:10px; background:rgba(10,12,16,.65); backdrop-filter:blur(4px);}
  .poster-body{padding:14px 16px 16px;}
  .poster-body h3{font-size:14.5px; margin:0 0 8px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{
    font-size:10.5px; font-family:'IBM Plex Mono',monospace; color:var(--text-muted);
    background:var(--bg-soft); border:1px solid var(--border-soft); border-radius:5px; padding:3px 7px;
  }

  /* ---------- Empty / no results ---------- */
  .empty{
    text-align:center; padding:70px 20px; color:var(--text-muted);
    border:1px dashed var(--border); border-radius:var(--radius-lg); margin-top:10px;
  }
  .empty svg{width:34px; height:34px; color:var(--text-faint); margin-bottom:14px;}
  .empty h3{margin:0 0 6px; color:var(--text); font-size:16px;}
  .empty p{margin:0; font-size:13.5px;}

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100; display:none;
    background:rgba(6,7,10,.88); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:24px;
  }
  .lightbox.open{display:flex;}
  .lb-inner{width:100%; max-width:900px; display:flex; flex-direction:column; gap:14px;}
  .lb-frame{
    position:relative; width:100%; border-radius:var(--radius-lg); overflow:hidden;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; min-height:280px;
  }
  .lb-frame img{width:100%; max-height:72vh; object-fit:contain; display:block;}
  .lb-watermark{
    position:absolute; bottom:12px; right:14px; font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:rgba(255,255,255,.55); background:rgba(0,0,0,.35);
    padding:4px 9px; border-radius:6px; letter-spacing:.03em; pointer-events:none;
  }
  .lb-meta{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .lb-meta h3{margin:0 0 4px; font-size:17px;}
  .lb-meta .path{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-faint);}
  .lb-controls{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .18s var(--ease);
  }
  .icon-btn:hover{border-color:var(--gold); color:var(--gold-bright); background:var(--surface-hover);}
  .icon-btn svg{width:16px;height:16px;}
  .lb-close{position:absolute; top:-46px; right:0;}

  /* ---------- Footer ---------- */
  footer{
    max-width:1240px; margin:0 auto; padding:26px 28px 50px; color:var(--text-faint);
    font-size:12px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
    border-top:1px solid var(--border-soft); margin-top:20px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:720px){
    .topbar{padding:12px 16px; gap:12px;}
    .brand-word{display:none;}
    .owner-pill span.label{display:none;}
    .ticker{padding:12px 16px 2px;}
    main{padding:14px 16px 70px;}
    .hero-line h1{font-size:21px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
    .grid.posters{grid-template-columns:repeat(2,1fr);}
    .lb-close{top:auto; bottom:-46px; right:0;}
    footer{padding:20px 16px 40px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="3" fill="#0a0c10"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.8 2.8M15.2 15.2 18 18M18 6l-2.8 2.8M8.8 15.2 6 18" stroke="#0a0c10" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div class="brand-word">Vault<span>.ilmu</span></div>
  </div>

  <div class="searchbar">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-3.8-3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="cari subjek, tajuk atau poster…" autocomplete="off">
    <span class="kbd">/</span>
  </div>

  <div class="topbar-right">
    <div class="owner-pill"><span class="dot"></span><span class="label">Hak milik</span>&nbsp;<span id="ownerName" class="mono"></span></div>
  </div>
</header>

<nav class="ticker" id="ticker"></nav>

<main id="main"></main>

<footer>
  <span id="footerOwner"></span>
  <span class="mono" id="footerCount"></span>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lb-inner">
    <div style="display:flex; justify-content:flex-end; position:relative;">
      <button class="icon-btn lb-close" id="lbCloseBtn" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="lb-frame" id="lbFrame">
      <img id="lbImage" src="" alt="">
      <span class="lb-watermark" id="lbWatermark"></span>
    </div>
    <div class="lb-meta">
      <div>
        <h3 id="lbTitle"></h3>
        <div class="path mono" id="lbPath"></div>
      </div>
      <div class="lb-controls">
        <button class="icon-btn" id="lbPrev" aria-label="Poster sebelum">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="lbNext" aria-label="Poster seterusnya">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="posters-data.js"></script>
<script>
(function(){
  "use strict";

  /* ============ Icons ============ */
  const ICONS = {
    "square-function": '<svg viewBox="0 0 24 24" fill="none"><path d="M9 20c2-1 3-3 3.5-6M14 4c-2 1-3 3-3.5 6M6 12h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    "flask-conical":   '<svg viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3.02L14 9V3" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    "book-open-text":  '<svg viewBox="0 0 24 24" fill="none"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 6.5V20" stroke="currentColor" stroke-width="1.6"/></svg>',
    "landmark":        '<svg viewBox="0 0 24 24" fill="none"><path d="M3 21h18M4 10h16M12 3l9 5H3l9-5ZM5 10v9M9 10v9M15 10v9M19 10v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "folder":          '<svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    "image":           '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L4 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "search-off":      '<svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M21 21l-3.8-3.8M8 8l6 6M14 8l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
  };
  function icon(name){ return ICONS[name] || ICONS.folder; }

  /* ============ Setup from data file ============ */
  const OWNER = (typeof SITE_OWNER !== "undefined") ? SITE_OWNER : "Pemilik Laman";
  document.getElementById("ownerName").textContent = OWNER;
  document.getElementById("footerOwner").textContent = "© " + (typeof SITE_YEAR !== "undefined" ? SITE_YEAR : new Date().getFullYear()) + " " + OWNER + ". Semua poster dilindungi hak cipta.";

  const DATA = (typeof posterData !== "undefined") ? posterData : { subjects: [] };

  /* ============ Helpers: flatten & code generation ============ */
  function pad(n, len){ return String(n).padStart(len, "0"); }

  // Precompute a sequential code per poster within its subject: e.g. MM-001
  function buildIndex(){
    const flat = []; // {subject, title, poster, code}
    DATA.subjects.forEach(subject => {
      let counter = 0;
      subject.titles.forEach(title => {
        title.posters.forEach(poster => {
          counter++;
          flat.push({
            subject, title, poster,
            code: (subject.code || "XX") + "-" + pad(counter, 3)
          });
        });
      });
    });
    return flat;
  }
  const FLAT = buildIndex();

  function countPostersInSubject(subject){
    return subject.titles.reduce((sum, t) => sum + t.posters.length, 0);
  }
  function countPostersInTitle(title){ return title.posters.length; }

  document.getElementById("footerCount").textContent = FLAT.length + " POSTER TERSIMPAN";

  /* ============ App state ============ */
  const state = { view: "home", subjectId: null, titleId: null, query: "" };

  function findSubject(id){ return DATA.subjects.find(s => s.id === id); }
  function findTitle(subject, id){ return subject.titles.find(t => t.id === id); }

  function goHome(){ state.view = "home"; state.subjectId = null; state.titleId = null; state.query=""; searchInput.value=""; render(); }
  function goSubject(id){ state.view = "subject"; state.subjectId = id; state.titleId = null; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  function goTitle(subjectId, titleId){ state.view = "title"; state.subjectId = subjectId; state.titleId = titleId; render(); window.scrollTo({top:0,behavior:"smooth"}); }

  /* ============ Breadcrumb ============ */
  function renderTicker(){
    const el = document.getElementById("ticker");
    const parts = [];
    parts.push(`<button data-nav="home">◆ INDEKS</button>`);

    if(state.query){
      el.innerHTML = parts.join(`<span class="sep">›</span>`) + `<span class="sep">›</span><span class="current">CARIAN: "${escapeHtml(state.query)}"</span>`;
      bindTicker(el); return;
    }

    if(state.view === "home"){
      el.innerHTML = parts.join("") + `<span class="sep">›</span><span class="current">SEMUA SUBJEK</span>`;
    } else if(state.view === "subject"){
      const subject = findSubject(state.subjectId);
      parts.push(`<span class="current">${subject.code} · ${escapeHtml(subject.name)}</span>`);
      el.innerHTML = parts.join(`<span class="sep">›</span>`);
    } else if(state.view === "title"){
      const subject = findSubject(state.subjectId);
      const title = findTitle(subject, state.titleId);
      parts.push(`<button data-nav="subject" data-id="${subject.id}">${subject.code} · ${escapeHtml(subject.name)}</button>`);
      parts.push(`<span class="current">${escapeHtml(title.name)}</span>`);
      el.innerHTML = parts.join(`<span class="sep">›</span>`);
    }
    bindTicker(el);
  }
  function bindTicker(el){
    el.querySelectorAll("[data-nav]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const nav = btn.getAttribute("data-nav");
        if(nav === "home") goHome();
        else if(nav === "subject") goSubject(btn.getAttribute("data-id"));
      });
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  /* ============ Rendering: views ============ */
  const mainEl = document.getElementById("main");

  function render(){
    renderTicker();
    if(state.query){ renderSearchResults(); return; }
    if(state.view === "home") renderHome();
    else if(state.view === "subject") renderSubject();
    else if(state.view === "title") renderTitleView();
  }

  function renderHome(){
    const totalPosters = FLAT.length;
    let html = `
      <div class="hero-line">
        <div>
          <h1>Arkib Peta Minda</h1>
          <p>Semua bahan disusun mengikut subjek — pilih folder untuk teroka.</p>
        </div>
        <div class="count-badge mono">${DATA.subjects.length} SUBJEK · ${totalPosters} POSTER</div>
      </div>
      <div class="grid">
    `;
    DATA.subjects.forEach(subject => {
      const total = countPostersInSubject(subject);
      html += `
        <div class="card" data-open-subject="${subject.id}">
          <div class="card-top">
            <div class="card-icon">${icon(subject.icon)}</div>
            <span class="code-pill mono">${subject.code}</span>
          </div>
          <h3>${escapeHtml(subject.name)}</h3>
          <p class="desc">${escapeHtml(subject.description || "")}</p>
          <div class="card-foot">
            <span class="stat">${subject.titles.length} TAJUK · ${total} POSTER</span>
            <span class="arrow">→</span>
          </div>
        </div>`;
    });
    html += `</div>`;

    if(DATA.subjects.length === 0){
      html = emptyState("folder", "Belum ada subjek", "Tambah subjek pertama anda dalam posters-data.js untuk mula membina arkib.");
    }

    mainEl.innerHTML = html;
    mainEl.querySelectorAll("[data-open-subject]").forEach(card=>{
      card.addEventListener("click", ()=> goSubject(card.getAttribute("data-open-subject")));
    });
  }

  function renderSubject(){
    const subject = findSubject(state.subjectId);
    if(!subject){ goHome(); return; }
    let html = `
      <div class="hero-line">
        <div>
          <h1>${escapeHtml(subject.name)}</h1>
          <p>${escapeHtml(subject.description || "Senarai tajuk dalam subjek ini.")}</p>
        </div>
        <div class="count-badge mono">${subject.titles.length} TAJUK</div>
      </div>
      <div class="grid titles">
    `;
    subject.titles.forEach(title=>{
      const n = countPostersInTitle(title);
      html += `
        <div class="card" data-open-title="${title.id}">
          <div class="card-top">
            <div class="card-icon">${icon("folder")}</div>
            <span class="code-pill mono">${subject.code}</span>
          </div>
          <h3>${escapeHtml(title.name)}</h3>
          <p class="desc">${escapeHtml(title.description || "")}</p>
          <div class="card-foot">
            <span class="stat">${n} POSTER</span>
            <span class="arrow">→</span>
          </div>
        </div>`;
    });
    html += `</div>`;

    if(subject.titles.length === 0){
      html += emptyState("folder", "Belum ada tajuk", "Tambah tajuk pertama untuk subjek ini dalam posters-data.js.");
    }

    mainEl.innerHTML = html;
    mainEl.querySelectorAll("[data-open-title]").forEach(card=>{
      card.addEventListener("click", ()=> goTitle(subject.id, card.getAttribute("data-open-title")));
    });
  }

  function renderTitleView(){
    const subject = findSubject(state.subjectId);
    if(!subject){ goHome(); return; }
    const title = findTitle(subject, state.titleId);
    if(!title){ goSubject(subject.id); return; }

    let html = `
      <div class="hero-line">
        <div>
          <h1>${escapeHtml(title.name)}</h1>
          <p>${escapeHtml(title.description || "Senarai poster dalam tajuk ini.")}</p>
        </div>
        <div class="count-badge mono">${title.posters.length} POSTER</div>
      </div>
      <div class="grid posters">
    `;

    const list = FLAT.filter(f => f.subject.id === subject.id && f.title.id === title.id);
    list.forEach((f, i) => {
      html += posterCardHtml(f, i, list);
    });
    html += `</div>`;

    if(title.posters.length === 0){
      html += emptyState("image", "Belum ada poster", "Upload imej ke posters/" + subject.id + "/" + title.id + "/ dan daftarkan dalam posters-data.js.");
    }

    mainEl.innerHTML = html;
    bindPosterCards(list);
  }

  function posterCardHtml(f, i, list){
    const src = `posters/${f.subject.id}/${f.title.id}/${f.poster.file}`;
    const tags = (f.poster.tags || []).map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join("");
    return `
      <div class="card poster-card" data-poster-index="${i}">
        <div class="poster-thumb">
          <img src="${src}" alt="${escapeHtml(f.poster.title)}" loading="lazy"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="fallback-icon" style="display:none; align-items:center; justify-content:center; width:100%; height:100%;">${icon("image")}</div>
          <span class="code-pill mono">${f.code}</span>
        </div>
        <div class="poster-body">
          <h3>${escapeHtml(f.poster.title)}</h3>
          <div class="tags">${tags}</div>
        </div>
      </div>`;
  }

  function bindPosterCards(list){
    mainEl.querySelectorAll("[data-poster-index]").forEach(card=>{
      card.addEventListener("click", ()=>{
        const idx = parseInt(card.getAttribute("data-poster-index"), 10);
        openLightbox(list, idx);
      });
    });
  }

  function emptyState(iconName, title, desc){
    return `
      <div class="empty">
        ${icon(iconName)}
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(desc)}</p>
      </div>`;
  }

  /* ============ Search ============ */
  const searchInput = document.getElementById("searchInput");
  let searchDebounce;
  searchInput.addEventListener("input", ()=>{
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{
      state.query = searchInput.value.trim().toLowerCase();
      render();
    }, 140);
  });
  document.addEventListener("keydown", (e)=>{
    if(e.key === "/" && document.activeElement !== searchInput){
      e.preventDefault(); searchInput.focus();
    }
    if(e.key === "Escape" && document.activeElement === searchInput && searchInput.value){
      searchInput.value=""; state.query=""; render();
    }
  });

  function renderSearchResults(){
    const q = state.query;
    const results = FLAT.filter(f=>{
      return f.subject.name.toLowerCase().includes(q)
        || f.title.name.toLowerCase().includes(q)
        || f.poster.title.toLowerCase().includes(q)
        || (f.poster.tags||[]).some(t=>t.toLowerCase().includes(q))
        || f.code.toLowerCase().includes(q);
    });

    let html = `
      <div class="hero-line">
        <div>
          <h1>Hasil Carian</h1>
          <p>Dipadankan dengan subjek, tajuk, poster & tag.</p>
        </div>
        <div class="count-badge mono">${results.length} DIJUMPAI</div>
      </div>
      <div class="grid posters">
    `;
    results.forEach((f,i)=>{ html += posterCardHtml(f, i, results); });
    html += `</div>`;

    if(results.length === 0){
      html += emptyState("search-off", "Tiada hasil", `Tiada padanan untuk "${q}". Cuba kata kunci lain.`);
    }
    mainEl.innerHTML = html;
    bindPosterCards(results);
  }

  /* ============ Lightbox ============ */
  const lightbox = document.getElementById("lightbox");
  const lbImage  = document.getElementById("lbImage");
  const lbTitle  = document.getElementById("lbTitle");
  const lbPath   = document.getElementById("lbPath");
  const lbWatermark = document.getElementById("lbWatermark");
  let currentList = [], currentIdx = 0;

  function openLightbox(list, idx){
    currentList = list; currentIdx = idx;
    paintLightbox();
    lightbox.classList.add("open");
    lightbox.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox(){
    lightbox.classList.remove("open");
    lightbox.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }
  function paintLightbox(){
    const f = currentList[currentIdx];
    if(!f) return;
    const src = `posters/${f.subject.id}/${f.title.id}/${f.poster.file}`;
    lbImage.src = src;
    lbImage.alt = f.poster.title;
    lbTitle.textContent = f.poster.title;
    lbPath.textContent = `${f.code}  ·  ${f.subject.name} / ${f.title.name}`;
    lbWatermark.textContent = "© " + OWNER;
  }
  document.getElementById("lbCloseBtn").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e)=>{ if(e.target === lightbox) closeLightbox(); });
  document.getElementById("lbPrev").addEventListener("click", ()=>{
    currentIdx = (currentIdx - 1 + currentList.length) % currentList.length; paintLightbox();
  });
  document.getElementById("lbNext").addEventListener("click", ()=>{
    currentIdx = (currentIdx + 1) % currentList.length; paintLightbox();
  });
  document.addEventListener("keydown", (e)=>{
    if(!lightbox.classList.contains("open")) return;
    if(e.key === "Escape") closeLightbox();
    if(e.key === "ArrowLeft") document.getElementById("lbPrev").click();
    if(e.key === "ArrowRight") document.getElementById("lbNext").click();
  });

  /* Basic protective measures for poster ownership */
  document.addEventListener("contextmenu", (e)=>{
    if(e.target.tagName === "IMG") e.preventDefault();
  });
  document.addEventListener("dragstart", (e)=>{
    if(e.target.tagName === "IMG") e.preventDefault();
  });

  /* ============ Init ============ */
  render();
})();
</script>

</body>
</html>

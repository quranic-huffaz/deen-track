<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Majma' al-Mulahazat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12;
    --bg-elevated:#0D1117;
    --surface:#141922;
    --surface-hover:#1A212C;
    --border:rgba(201,164,92,.14);
    --border-strong:rgba(201,164,92,.36);
    --gold:#C9A45C;
    --gold-bright:#E4C583;
    --teal:#4FB8AC;
    --text-primary:#EDEFF3;
    --text-secondary:#9AA3B5;
    --text-tertiary:#5B6376;
    --radius:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 0 rgba(255,255,255,.02) inset, 0 20px 40px -24px rgba(0,0,0,.6);
    --ease: cubic-bezier(.22,1,.36,1);
    --topbar-bg: rgba(10,13,18,.72);
    --bottombar-h: 84px;
  }

  *{box-sizing:border-box;}
  body, .card, .row, .btn, header.topbar, .support-btn, .icon-btn, .search-wrap input{
    transition: background-color .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease);
  }
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 480px at 12% -10%, rgba(201,164,92,.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(79,184,172,.06), transparent 55%),
      var(--bg);
    color:var(--text-primary);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:rgba(201,164,92,.28); color:#fff; }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}

  .mono{ font-family:'JetBrains Mono', monospace; letter-spacing:.02em; }

  /* ---------- Layout shell ---------- */
  .shell{
    max-width:1120px;
    margin:0 auto;
    padding:0 24px calc(var(--bottombar-h) + 28px);
  }

  header.topbar{
    position:sticky; top:0; z-index:40;
    backdrop-filter:blur(14px) saturate(140%);
    background:var(--topbar-bg);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1120px; margin:0 auto;
    padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, #1c2330, #0d1117);
    border:1px solid var(--border-strong);
    font-family:'Fraunces', serif; font-weight:600; font-size:17px;
    color:var(--gold-bright);
    flex-shrink:0;
  }
  .brand-text h1{
    margin:0; font-family:'Fraunces', serif; font-weight:600;
    font-size:17px; letter-spacing:.01em; color:var(--text-primary);
  }
  .brand-text p{
    margin:1px 0 0; font-size:11.5px; color:var(--text-tertiary);
    letter-spacing:.04em; text-transform:uppercase;
  }
  .topbar-status{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--text-tertiary);
  }
  .status-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 3px rgba(79,184,172,.15);
  }

  /* ---------- Support Button: cawan kopi beranimasi + bubble tooltip ---------- */
  .support-wrap{
    display:flex; flex-direction:row-reverse; align-items:center; gap:10px;
    position:relative;
  }
  .support-btn{
    position:relative;
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(201,164,92,.15);
    border:1px solid rgba(201,164,92,.4);
    transition:background .22s var(--ease), border-color .22s var(--ease), transform .22s var(--ease), box-shadow .22s var(--ease);
  }
  .support-btn:hover{
    background:rgba(201,164,92,.28);
    border-color:var(--gold-bright);
    transform:scale(1.08);
    box-shadow:0 0 0 6px rgba(201,164,92,.1), 0 6px 18px -6px rgba(201,164,92,.55);
  }
  .support-btn svg{ width:22px; height:22px; overflow:visible; }
  .support-btn .cup-body{ fill:var(--gold-bright); stroke:none; }
  .support-btn .cup-handle{ fill:none; stroke:var(--gold-bright); stroke-width:1.4; stroke-linecap:round; }
  .support-btn .steam-line{
    fill:none; stroke:var(--gold-bright); stroke-width:1.3; stroke-linecap:round;
    opacity:.7; transform-origin:center bottom;
    animation:steamWave 2.6s ease-in-out infinite;
  }
  .support-btn .steam-line.s2{ animation-delay:.55s; }
  @keyframes steamWave{
    0%{ transform:translateY(1px) scaleX(1); opacity:.15; }
    35%{ opacity:.75; }
    50%{ transform:translateY(-2px) scaleX(1.08); opacity:.6; }
    100%{ transform:translateY(-5px) scaleX(.94); opacity:.05; }
  }

  .support-bubble{
    position:absolute; right:52px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center;
    padding:8px 14px; border-radius:999px;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#141110; font-size:11.5px; font-weight:700; white-space:nowrap;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.5);
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
    z-index:45;
  }
  .support-bubble.show{ opacity:1; }
  .support-bubble::after{
    content:"";
    position:absolute; right:-5px; top:50%; transform:translateY(-50%) rotate(45deg);
    width:9px; height:9px;
    background:var(--gold);
  }
  @media (max-width:640px){
    .support-btn{ width:36px; height:36px; }
    .support-btn svg{ width:19px; height:19px; }
    .support-bubble{ font-size:10.5px; padding:7px 11px; right:46px; }
  }

  /* ---------- Chip button (butang pada kad/baris) ---------- */
  .chip-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:600;
    padding:7px 13px; border-radius:999px;
    border:1px solid var(--border-strong);
    color:var(--gold-bright);
    background:rgba(201,164,92,.06);
    transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);
    white-space:nowrap;
  }
  .chip-btn svg{ width:12px; height:12px; }
  .card:hover .chip-btn, .row:hover .chip-btn{
    background:linear-gradient(155deg, var(--gold-bright), var(--gold));
    color:#141110; border-color:transparent; transform:translateX(2px);
  }

  /* ---------- Icon button (salin pautan) ---------- */
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--border-strong);
    background:rgba(201,164,92,.06);
    color:var(--text-secondary);
    cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .icon-btn svg{ width:14px; height:14px; }
  .icon-btn:hover{ background:var(--surface-hover); border-color:var(--gold); color:var(--gold-bright); }
  .icon-btn:active{ transform:scale(.9); }
  .icon-btn.copied{ color:var(--teal); border-color:rgba(79,184,172,.5); background:rgba(79,184,172,.1); }
  .card-foot-actions, .row-actions{ display:flex; align-items:center; gap:8px; }

  /* ---------- Page actions (legasi — kekal jika digunakan di tempat lain) ---------- */
  .page-actions{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:18px;
  }
  .share-wrap{ position:relative; }
  .share-popup{
    position:absolute; right:0; bottom:calc(100% + 8px);
    min-width:190px; z-index:50;
    background:linear-gradient(160deg, #171310, #0b0908);
    border:1px solid rgba(201,164,92,.4);
    border-radius:16px;
    padding:6px;
    box-shadow:0 20px 44px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(201,164,92,.08) inset;
    opacity:0; pointer-events:none;
    transform:translateY(6px);
    transition:opacity .2s var(--ease), transform .2s var(--ease);
  }
  .share-wrap.open .share-popup{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .share-option{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:10px 12px; border-radius:11px;
    background:transparent; border:none;
    color:var(--text-primary); font-size:13px; font-weight:500;
    cursor:pointer; text-align:left;
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .share-option svg{ width:16px; height:16px; flex-shrink:0; color:var(--gold-bright); }
  .share-option:hover{ background:rgba(201,164,92,.12); }
  .share-option.copied{ color:var(--teal); }
  .share-option.copied svg{ color:var(--teal); }

  /* ---------- Butang bulat MENU (ala iPhone) — kini di tengah bar bawah ---------- */
  .fab-wrap{
    position:relative;
    margin-top:-24px;
  }
  .fab-btn{
    position:relative;
    width:56px; height:56px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    background:radial-gradient(circle at 35% 30%, #2a2013, #0a0806 72%);
    border:1px solid rgba(201,164,92,.55);
    box-shadow:
      0 0 0 1px rgba(201,164,92,.12) inset,
      0 0 14px rgba(201,164,92,.28),
      0 8px 20px -8px rgba(0,0,0,.65);
    cursor:pointer;
    transition:transform .25s var(--ease), box-shadow .25s var(--ease);
  }
  .fab-btn:hover{
    transform:scale(1.06);
    box-shadow:
      0 0 0 1px rgba(201,164,92,.2) inset,
      0 0 26px rgba(201,164,92,.45),
      0 12px 30px -8px rgba(0,0,0,.7);
  }
  .fab-wrap.open .fab-btn{ transform:rotate(90deg); }
  .fab-wrap.open .fab-btn:hover{ transform:rotate(90deg) scale(1.06); }
  .fab-ring{
    position:absolute; inset:0; border-radius:50%;
    border:1px solid var(--gold-bright);
    opacity:0; pointer-events:none;
    animation:fabPulse 2.6s ease-out infinite;
  }
  .fab-ring.r2{ animation-delay:1.3s; }
  @keyframes fabPulse{
    0%{ transform:scale(1); opacity:.55; }
    100%{ transform:scale(1.55); opacity:0; }
  }
  .fab-dot{
    width:5px; height:5px; border-radius:50%;
    background:var(--gold-bright);
    animation:fabBlink 1.8s ease-in-out infinite;
  }
  @keyframes fabBlink{
    0%, 100%{ opacity:1; } 50%{ opacity:.25; }
  }
  .fab-label{
    font-size:7.5px; font-weight:700; letter-spacing:.12em;
    color:var(--gold-bright); text-transform:uppercase;
  }

  .fab-popup{
    position:absolute; left:50%; bottom:calc(100% + 16px);
    transform:translateX(-50%) translateY(8px) scale(.9);
    width:230px;
    background:linear-gradient(160deg, #171310, #0b0908);
    border:1px solid rgba(201,164,92,.4);
    border-radius:18px;
    padding:16px;
    box-shadow:0 20px 44px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(201,164,92,.08) inset;
    opacity:0; pointer-events:none;
    transform-origin:bottom center;
    transition:opacity .22s var(--ease), transform .22s var(--ease);
  }
  .fab-wrap.open .fab-popup{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0) scale(1); }
  .fab-popup::after{
    content:"";
    position:absolute; left:50%; bottom:-7px; transform:translateX(-50%) rotate(45deg);
    width:14px; height:14px;
    background:#171310;
    border-right:1px solid rgba(201,164,92,.4);
    border-bottom:1px solid rgba(201,164,92,.4);
  }
  .fab-eyebrow{
    font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-tertiary); margin:0 0 10px 4px;
  }
  .fab-list{ display:flex; flex-direction:column; gap:4px; }
  .fab-list-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 8px; border-radius:11px;
    color:var(--text-primary); cursor:pointer;
    transition:background .18s var(--ease), transform .18s var(--ease);
  }
  .fab-list-item:hover{ background:rgba(201,164,92,.12); transform:translateX(-3px); }
  .fab-list-item .ico{
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    background:linear-gradient(155deg, rgba(201,164,92,.35), rgba(201,164,92,.08));
  }
  .fab-list-item .txt{ flex-grow:1; font-size:13px; font-weight:500; }
  .fab-list-item .chev{ font-size:14px; color:var(--text-tertiary); }
  .fab-list-item.as-button{ background:transparent; border:none; font:inherit; text-align:left; width:100%; }
  .fab-list-item.as-button .ico svg{ width:16px; height:16px; }
  @media (max-width:640px){
    .fab-wrap{ margin-top:-18px; }
    .fab-btn{ width:46px; height:46px; }
    .fab-label{ font-size:6.5px; }
    .fab-popup{ width:200px; padding:13px; }
  }

  /* ---------- Bar Bawah Tetap: Kembali (kiri) · Menu (tengah) · Share (kanan) ---------- */
  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:70;
    background:var(--topbar-bg);
    backdrop-filter:blur(16px) saturate(150%);
    border-top:1px solid var(--border);
    box-shadow:0 -14px 34px -18px rgba(0,0,0,.55);
    padding:12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .bottom-bar-inner{
    max-width:1120px; margin:0 auto;
    display:grid; grid-template-columns:1fr auto 1fr;
    align-items:center; gap:14px;
  }
  .bb-side{ display:flex; align-items:center; min-width:0; }
  .bb-side.bb-left{ justify-content:flex-start; }
  .bb-side.bb-right{ justify-content:flex-end; }

  @media (max-width:640px){
    .bottom-bar{ padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
    .bottom-bar-inner{ gap:8px; }
  }
  @media (max-width:480px){
    .bb-side .btn{
      width:46px; height:46px; padding:0; border-radius:50%;
      justify-content:center;
      position:relative;
      box-shadow:0 6px 16px -8px rgba(0,0,0,.5);
      transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), filter .18s var(--ease);
    }
    .bb-side .btn .btn-label{ display:none; }
    .bb-side .btn svg{ width:16px; height:16px; flex-shrink:0; }
    .bb-side .btn:active{ transform:scale(.9); }

    /* Kembali — bulatan sempadan emas halus, neutral & senyap */
    .bb-left .btn{
      background:var(--surface);
      border:1px solid var(--border-strong);
      color:var(--text-secondary);
    }
    .bb-left .btn:hover{ border-color:var(--gold); color:var(--gold-bright); }

    /* Share — bulatan emas pekat, aksi utama & eksklusif */
    .bb-right .btn{
      background:linear-gradient(155deg, var(--gold-bright), var(--gold));
      border-color:transparent;
      color:#141110;
      box-shadow:0 8px 20px -8px rgba(201,164,92,.55), 0 0 0 1px rgba(201,164,92,.28) inset;
    }
    .bb-right .btn:hover{ filter:brightness(1.06); }
  }

  /* ---------- Breadcrumb ---------- */
  .crumb{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    margin:28px 0 8px;
    font-size:13px;
    color:var(--text-tertiary);
  }
  .crumb a{ color:var(--text-secondary); transition:color .15s var(--ease); }
  .crumb a:hover{ color:var(--gold-bright); }
  .crumb .sep{ color:var(--text-tertiary); opacity:.5; }
  .crumb .current{ color:var(--text-primary); }

  /* ---------- Hero / page head ---------- */
  .page-head{
    margin:6px 0 36px;
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:24px; flex-wrap:wrap;
  }
  .page-head h2{
    font-family:'Fraunces', serif; font-weight:500;
    font-size:clamp(28px, 4vw, 40px);
    margin:0 0 8px; letter-spacing:-.01em;
  }
  .page-head .lede{
    margin:0; color:var(--text-secondary); font-size:15px; max-width:52ch; line-height:1.6;
  }
  .page-stats{
    display:flex; gap:28px;
  }
  .stat{ text-align:right; }
  .stat .num{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px; color:var(--gold-bright);
    display:block; line-height:1;
  }
  .stat .lbl{
    font-size:10.5px; color:var(--text-tertiary); text-transform:uppercase;
    letter-spacing:.08em; margin-top:6px; display:block;
  }

  /* ---------- Search ---------- */
  .search-wrap{ position:relative; margin-bottom:32px; }
  .search-wrap input{
    width:100%; background:var(--surface); border:1px solid var(--border);
    color:var(--text-primary); border-radius:var(--radius-sm);
    padding:13px 16px 13px 42px; font-size:14px; font-family:inherit;
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .search-wrap input::placeholder{ color:var(--text-tertiary); }
  .search-wrap input:focus{
    outline:none; border-color:var(--border-strong); background:var(--surface-hover);
  }
  .search-wrap svg{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    color:var(--text-tertiary); pointer-events:none;
  }

  /* ---------- Search row (kotak carian + butang Bidang) ---------- */
  .search-row{
    display:flex; align-items:stretch; gap:10px;
    margin-bottom:32px;
  }
  .search-row .search-wrap{ flex:1 1 auto; margin-bottom:0; min-width:0; }

  .filter-wrap{ position:relative; flex-shrink:0; }
  .filter-toggle{
    height:100%; gap:8px; padding:0 16px;
  }
  .filter-toggle svg{ width:14px; height:14px; flex-shrink:0; }
  .filter-toggle .chev{ display:flex; transition:transform .2s var(--ease); }
  .filter-wrap.open .filter-toggle .chev{ transform:rotate(180deg); }
  .filter-toggle .filter-label-text{ white-space:nowrap; }
  .filter-toggle.active-filter{
    border-color:var(--gold); color:var(--gold-bright);
    background:rgba(201,164,92,.1);
  }

  .filter-popup{
    position:absolute; right:0; top:calc(100% + 8px);
    min-width:210px; max-height:280px; overflow-y:auto;
    z-index:50;
    background:linear-gradient(160deg, #171310, #0b0908);
    border:1px solid rgba(201,164,92,.4);
    border-radius:16px;
    padding:6px;
    box-shadow:0 20px 44px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(201,164,92,.08) inset;
    opacity:0; pointer-events:none;
    transform:translateY(6px);
    transition:opacity .2s var(--ease), transform .2s var(--ease);
  }
  .filter-wrap.open .filter-popup{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .filter-option{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:10px 12px; border-radius:11px;
    background:transparent; border:none;
    color:var(--text-primary); font-size:13px; font-weight:500;
    cursor:pointer; text-align:left;
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .filter-option:hover{ background:rgba(201,164,92,.12); }
  .filter-option.active{ color:var(--gold-bright); }
  .filter-option .tick{ opacity:0; font-size:12px; transition:opacity .15s var(--ease); }
  .filter-option.active .tick{ opacity:1; }

  @media (max-width:640px){
    .filter-toggle .filter-label-text{ display:none; }
    .filter-toggle{ padding:0 13px; }
    .filter-popup{ min-width:180px; }
  }

  /* ---------- Card grid (Subjek = folders) ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow-card);
    cursor:pointer;
    transition:transform .22s var(--ease), border-color .22s var(--ease), background .22s var(--ease);
    display:flex; flex-direction:column; gap:16px;
    position:relative;
    overflow:hidden;
  }
  .card::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(140deg, rgba(201,164,92,.07), transparent 45%);
    opacity:0; transition:opacity .22s var(--ease);
    pointer-events:none;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--border-strong);
    background:var(--surface-hover);
  }
  .card:hover::after{ opacity:1; }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-kod{
    font-size:11px; color:var(--gold-bright);
    background:rgba(201,164,92,.1);
    border:1px solid var(--border-strong);
    padding:3px 8px; border-radius:6px;
    letter-spacing:.06em;
  }
  .card-icon{
    width:34px; height:34px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--text-tertiary);
    flex-shrink:0;
    transition:color .2s var(--ease), border-color .2s var(--ease);
  }
  .card:hover .card-icon{ color:var(--gold-bright); border-color:var(--border-strong); }
  .card h3{
    margin:0; font-family:'Fraunces', serif; font-weight:500; font-size:19px;
    color:var(--text-primary);
  }
  .card p.desc{
    margin:0; font-size:13.5px; color:var(--text-secondary); line-height:1.55;
    flex-grow:1;
  }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:14px; margin-top:auto;
    border-top:1px solid var(--border);
    font-size:12px; color:var(--text-tertiary);
  }
  .card-foot .count{ color:var(--text-secondary); }
  .card-foot .arrow{ color:var(--text-tertiary); transition:transform .22s var(--ease), color .22s var(--ease); }
  .card:hover .card-foot .arrow{ transform:translateX(3px); color:var(--gold-bright); }

  /* ---------- Rak Kitab: persembahan bookshelf untuk kad Subjek di Utama ---------- */
  .shelf-case{
    position:relative;
    padding:26px 24px 4px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:
      radial-gradient(900px 220px at 50% -10%, rgba(201,164,92,.07), transparent 60%),
      var(--bg-elevated);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .shelf-case::before{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    border-left:11px solid transparent;
    border-right:11px solid transparent;
    border-image:linear-gradient(180deg, #4a3620, #241a10 45%, #1c130c) 1;
    pointer-events:none;
    opacity:.92;
  }
  .shelf-case-head{
    display:flex; align-items:center; gap:8px;
    margin-bottom:16px; padding:0 2px;
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--text-tertiary);
  }
  .shelf-case-head svg{ width:13px; height:13px; color:var(--gold-bright); flex-shrink:0; }

  .shelf-grid{
    --shelf-h:226px;
    --shelf-gap:30px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
    grid-auto-rows:var(--shelf-h);
    gap:var(--shelf-gap);
    padding-bottom:var(--shelf-gap);
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent var(--shelf-h),
      rgba(0,0,0,.5) var(--shelf-h),
      #1c130c calc(var(--shelf-h) + 4px),
      #4a3620 calc(var(--shelf-h) + (var(--shelf-gap) * .5)),
      #1c130c calc(var(--shelf-h) + var(--shelf-gap) - 5px),
      transparent calc(var(--shelf-h) + var(--shelf-gap))
    );
  }

  .book-card{
    --spine:var(--gold-bright);
    box-shadow:inset 0 5px 0 0 var(--spine), var(--shadow-card);
    border-radius:7px 7px 3px 3px;
    padding-top:24px;
    padding-right:26px;
  }
  .book-card::before{
    content:"";
    position:absolute; top:14px; right:9px; bottom:14px; width:4px;
    background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.1) 0 2px, transparent 2px 5px);
    border-radius:2px;
    pointer-events:none;
    opacity:.55;
  }
  .book-card h3{
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .shelf-grid .book-card:nth-child(4n+1){ --spine:var(--gold-bright); }
  .shelf-grid .book-card:nth-child(4n+2){ --spine:var(--teal); }
  .shelf-grid .book-card:nth-child(4n+3){ --spine:#C98F5C; }
  .shelf-grid .book-card:nth-child(4n+4){ --spine:#B9A4D8; }
  .book-card:hover{ transform:translateY(-10px) rotate(-.6deg); }

  @media (max-width:640px){
    .shelf-case{ padding:18px 16px 4px; }
    .shelf-case-head{ margin-bottom:12px; }
    .shelf-grid{ --shelf-h:182px; --shelf-gap:22px; grid-template-columns:repeat(auto-fill, minmax(126px, 1fr)); }
    .book-card{ padding:16px 20px 12px 14px; }
  }

  /* ---------- Topic list (rows, ledger style) ---------- */
  .row-list{ display:flex; flex-direction:column; gap:1px; background:var(--border); border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); }
  .row{
    background:var(--surface);
    padding:18px 22px;
    display:flex; align-items:center; gap:18px;
    cursor:pointer;
    transition:background .18s var(--ease);
  }
  .row:hover{ background:var(--surface-hover); }
  .row-kod{
    font-size:11.5px; color:var(--gold-bright);
    width:56px; flex-shrink:0;
  }
  .row-main{ flex-grow:1; min-width:0; }
  .row-main h4{
    margin:0 0 3px; font-family:'Fraunces', serif; font-weight:500; font-size:16.5px;
  }
  .row-main p{ margin:0; font-size:13px; color:var(--text-secondary); }
  .row-meta{
    display:flex; align-items:center; gap:14px; flex-shrink:0;
  }
  .badge{
    font-size:10.5px; padding:4px 9px; border-radius:20px;
    text-transform:uppercase; letter-spacing:.05em;
    border:1px solid var(--border-strong);
    white-space:nowrap;
  }
  .badge.ready{ color:var(--teal); border-color:rgba(79,184,172,.4); background:rgba(79,184,172,.08); }
  .badge.pending{ color:var(--text-tertiary); border-color:var(--border); background:transparent; }
  .row-arrow{ color:var(--text-tertiary); transition:transform .18s var(--ease), color .18s var(--ease); }
  .row:hover .row-arrow{ transform:translateX(3px); color:var(--gold-bright); }

  /* ---------- Viewer (embedded notion page) ---------- */
  .viewer-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:20px; flex-wrap:wrap; margin-bottom:20px;
  }
  .viewer-title h2{ margin:0 0 6px; }
  .viewer-title .meta{
    display:flex; gap:14px; flex-wrap:wrap;
    font-size:12px; color:var(--text-tertiary);
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 16px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:500; cursor:pointer;
    border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text-primary);
    transition:background .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease);
    white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-hover); border-color:var(--gold); transform:translateY(-1px); }
  .btn.primary{
    background:linear-gradient(155deg, var(--gold-bright), var(--gold));
    color:#141110; border-color:transparent; font-weight:600;
  }
  .btn.primary:hover{ filter:brightness(1.06); }

  .frame-wrap{
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--surface);
    box-shadow:var(--shadow-card);
    user-select:none;
  }
  .frame-chrome{
    display:flex; align-items:center; gap:8px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    background:var(--bg-elevated);
    cursor:grab;
  }
  .frame-chrome:active{ cursor:grabbing; }
  .frame-chrome .dot{ width:9px; height:9px; border-radius:50%; background:var(--border-strong); }
  .frame-chrome span{ margin-left:6px; font-size:11.5px; color:var(--text-tertiary); }
  iframe{
    width:100%; height:74vh; min-height:520px; border:none; display:block; background:#0d1117;
  }

  /* ---------- Page nav (swipe / drag prev-next macam muka surat) ---------- */
  .page-nav{
    position:relative;
  }

  .page-indicator{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    margin-top:16px;
  }
  .page-indicator .dots-row{
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .page-indicator .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--border-strong);
    transition:background .18s var(--ease), transform .18s var(--ease);
  }
  .page-indicator .dot.active{ background:var(--gold-bright); transform:scale(1.35); }
  .page-indicator .lbl{
    margin-left:8px; font-size:11.5px; color:var(--text-tertiary);
  }
  .page-indicator .hint{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--text-tertiary);
    letter-spacing:.02em;
  }
  .page-indicator .hint svg{ width:12px; height:12px; opacity:.7; }

  .frame-wrap.sliding-left{ animation:slideOutLeft .22s var(--ease); }
  .frame-wrap.sliding-right{ animation:slideOutRight .22s var(--ease); }
  .frame-wrap.entering{ animation:slideIn .28s var(--ease); }
  @keyframes slideOutLeft{ to{ opacity:.4; transform:translateX(-14px); } }
  @keyframes slideOutRight{ to{ opacity:.4; transform:translateX(14px); } }
  @keyframes slideIn{ from{ opacity:0; transform:translateX(0); } to{ opacity:1; transform:translateX(0); } }

  /* ---------- Empty state ---------- */
  .empty{
    padding:64px 24px;
    text-align:center;
    border:1px dashed var(--border-strong);
    border-radius:var(--radius);
    background:var(--surface);
  }
  .empty .glyph{
    width:52px; height:52px; margin:0 auto 20px;
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--gold-bright);
  }
  .empty h3{ font-family:'Fraunces', serif; font-weight:500; margin:0 0 8px; font-size:19px; }
  .empty p{ margin:0 auto; max-width:44ch; color:var(--text-secondary); font-size:13.5px; line-height:1.6; }
  .empty code{
    display:inline-block; margin-top:16px; font-family:'JetBrains Mono', monospace;
    font-size:11.5px; color:var(--gold-bright); background:rgba(201,164,92,.08);
    border:1px solid var(--border); padding:6px 10px; border-radius:6px;
  }

  /* ---------- View transition ---------- */
  #view{ animation:rise .38s var(--ease); }
  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  footer{
    max-width:1120px; margin:64px auto 0; padding:24px;
    padding-bottom:calc(24px + var(--bottombar-h));
    border-top:1px solid var(--border);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
    font-size:11.5px; color:var(--text-tertiary);
  }

  @media (max-width:640px){
    .shell{ padding:0 16px calc(var(--bottombar-h) + 20px); }
    .topbar-inner{ padding:14px 16px; }
    .page-stats{ display:none; }
    .row{ padding:16px; gap:12px; }
    .row-kod{ width:auto; }
    .badge{ display:none; }
    .viewer-head{ flex-direction:column; align-items:stretch; }
    .btn{ justify-content:center; }
    .page-actions{ margin-bottom:14px; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    #view, .card, .row, .btn{ animation:none !important; transition:none !important; }
  }

  /* ---------- Mod Cerah (Light Theme) — nuansa kertas manuskrip ---------- */
  body.theme-light{
    --bg:#F6F1E6;
    --bg-elevated:#FFFFFF;
    --surface:#FFFFFF;
    --surface-hover:#FAF4E7;
    --border:rgba(120,88,40,.16);
    --border-strong:rgba(120,88,40,.38);
    --gold:#B0833F;
    --gold-bright:#8A5F22;
    --teal:#1F8577;
    --text-primary:#241C10;
    --text-secondary:#5B4E39;
    --text-tertiary:#8C7C61;
    --topbar-bg:rgba(255,255,255,.8);
    --shadow-card: 0 1px 0 rgba(255,255,255,.6) inset, 0 20px 40px -26px rgba(90,66,26,.28);
  }
  body.theme-light ::selection{ background:rgba(176,131,63,.28); color:#241C10; }
</style>
</head>
<body>

<!-- Bar bawah tetap: Kembali (kiri) · Menu (tengah) · Share (kanan) -->

  <div class="bottom-bar-inner">

<script src="nota-data.js"></script>
<script>
(function(){

  const view = document.getElementById('view');
  const crumbEl = document.getElementById('crumb');
  const bbLeft = document.getElementById('bbLeft');
  const bbRight = document.getElementById('bbRight');

  // Bidang (kategori) yang sedang dipilih pada paparan Utama.
  // 'semua' = tiada penapisan kategori.
  let selectedBidangFilter = 'semua';

  /* ---------------- Ikon (inline SVG, ringan tanpa dependency) ---------------- */
  const ICONS = {
    folder: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>',
    arrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
    doc: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg>',
    ext: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',
    back: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
    swipe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 9l-4 3 4 3"/><path d="M16 9l4 3-4 3"/><path d="M4 12h16"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 10.6l7.2-4.2M8.4 13.4l7.2 4.2"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-12.9 7.3L4 20l1.2-4.1A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.8 10.3c.4 2.2 2.3 4.1 4.5 4.5"/></svg>',
    filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
    chevDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
    book: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5c-.8 0-1.5-.7-1.5-1.5v-13Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5c.8 0 1.5-.7 1.5-1.5v-13Z"/><path d="M12 4v16"/></svg>',
    shelf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4v16M20 4v16M4 9h16M4 15h16"/></svg>',
    candle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--gold-bright)"><rect x="9" y="10" width="6" height="10" rx="1.3"/><path d="M12 10V6.4"/><path d="M12 6.4c1.1-.9 1.4-2 .5-3.3-.5.9-1.5.9-2 0-.9 1.3-.6 2.4.5 3.3Z" fill="currentColor"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--gold-bright)"><path d="M20 14.2A8.3 8.3 0 1 1 9.8 4a6.8 6.8 0 0 0 10.2 10.2Z"/></svg>',
  };

  /* ---------------- Utiliti ---------------- */
  function slug(str){
    return String(str).toLowerCase().trim()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }
  function findSubjek(id){ return SUBJEK.find(s => slug(s.nama) === id); }
  function findTajuk(subjek, id){ return subjek.tajuk.find(t => slug(t.nama) === id); }
  function findSiri(tajuk, id){ return tajuk.siri.find(r => String(r.siri) === id); }
  function totalTajuk(){ return SUBJEK.reduce((n, s) => n + s.tajuk.length, 0); }
  function totalSiri(){ return SUBJEK.reduce((n, s) => n + s.tajuk.reduce((m, t) => m + t.siri.length, 0), 0); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  // Label paparan bagi satu siri: guna `nama` (bab) jika diisi dalam nota-data.js,
  // jika tidak, kembali kepada "Siri N" seperti biasa.
  function siriLabel(r){
    return (r && r.nama && String(r.nama).trim()) ? String(r.nama).trim() : `Siri ${r.siri}`;
  }
  // Label bidang bagi satu subjek: guna `bidang` jika diisi, jika tidak "Umum".
  function bidangLabel(s){
    return (s && s.bidang && String(s.bidang).trim()) ? String(s.bidang).trim() : 'Umum';
  }
  // Bina blok butang "Share" (dengan popup Salin / WhatsApp) untuk sesuatu ruang.
  function shareBlock(hash, titleText){
    const fullUrl = location.origin + location.pathname + hash;
    const waMsg = encodeURIComponent(`${titleText} — ${fullUrl}`);
    return `
      <div class="share-wrap">
        <button type="button" class="btn share-toggle">${ICONS.share}<span class="btn-label">Share</span></button>
        <div class="share-popup">
          <button type="button" class="share-option share-copy" data-copy-url="${escapeHtml(fullUrl)}">${ICONS.copy}<span>Salin</span></button>
          <a class="share-option share-wa" href="https://wa.me/?text=${waMsg}" target="_blank" rel="noopener">${ICONS.whatsapp}<span>WhatsApp</span></a>
        </div>
      </div>
    `;
  }
  // Bina butang "Kembali" untuk slot kiri bar bawah.
  function kembaliBlock(hash, primary){
    return `<a class="btn${primary ? ' primary' : ''}" href="${hash}">${ICONS.back}<span class="btn-label">Kembali</span></a>`;
  }
  // Kemaskini slot kiri (Kembali) & kanan (Share) pada bar bawah tetap.
  function setBottomBar(kembaliHtml, shareHtml){
    if(bbLeft) bbLeft.innerHTML = kembaliHtml || '';
    if(bbRight) bbRight.innerHTML = shareHtml || '';
  }

  /* ---------------- Salin pautan (delegasi klik) ---------------- */
  function fallbackCopy(text, cb){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    cb();
  }
  function performCopy(text, onDone){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(onDone).catch(() => fallbackCopy(text, onDone));
    } else {
      fallbackCopy(text, onDone);
    }
  }
  function copyToClipboard(text, btn){
    performCopy(text, () => {
      btn.classList.add('copied');
      btn.innerHTML = ICONS.check;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = ICONS.copy;
      }, 1500);
    });
  }
  // Terapkan carian teks + penapis bidang serentak pada grid Subjek (Utama).
  function applyBerandaFilters(){
    const input = document.getElementById('cari');
    const grid = document.getElementById('gridSubjek');
    if(!input || !grid) return;
    const q = input.value.trim().toLowerCase();
    grid.querySelectorAll('.card').forEach(card => {
      const matchSearch = card.dataset.search.includes(q);
      const matchBidang = selectedBidangFilter === 'semua' || card.dataset.bidang === selectedBidangFilter;
      card.style.display = (matchSearch && matchBidang) ? '' : 'none';
    });
  }

  document.addEventListener('click', (e) => {
    // Salin pautan (butang bulat pada baris/kad)
    const copyBtn = e.target.closest('.copy-btn');
    if(copyBtn){
      e.preventDefault();
      e.stopPropagation();
      const url = location.origin + location.pathname + copyBtn.dataset.copy;
      copyToClipboard(url, copyBtn);
      return;
    }
    // Togol popup Share (Salin / WhatsApp)
    const shareToggle = e.target.closest('.share-toggle');
    if(shareToggle){
      e.preventDefault();
      e.stopPropagation();
      const wrap = shareToggle.closest('.share-wrap');
      const willOpen = !wrap.classList.contains('open');
      document.querySelectorAll('.share-wrap.open, .filter-wrap.open').forEach(w => w.classList.remove('open'));
      if(willOpen) wrap.classList.add('open');
      return;
    }
    // Pilihan "Salin" dalam popup Share
    const shareCopy = e.target.closest('.share-copy');
    if(shareCopy){
      e.preventDefault();
      e.stopPropagation();
      const url = shareCopy.dataset.copyUrl;
      const original = shareCopy.innerHTML;
      performCopy(url, () => {
        shareCopy.classList.add('copied');
        shareCopy.innerHTML = `${ICONS.check}<span>Disalin!</span>`;
        setTimeout(() => {
          shareCopy.classList.remove('copied');
          shareCopy.innerHTML = original;
        }, 1500);
      });
      return;
    }
    // Pilihan "WhatsApp" dalam popup Share — tutup popup selepas dibuka
    const shareWa = e.target.closest('.share-wa');
    if(shareWa){
      e.stopPropagation();
      const wrap = shareWa.closest('.share-wrap');
      setTimeout(() => { if(wrap) wrap.classList.remove('open'); }, 150);
    }
    // Togol popup Bidang (dropdown kategori pada Utama)
    const filterToggle = e.target.closest('.filter-toggle');
    if(filterToggle){
      e.preventDefault();
      e.stopPropagation();
      const wrap = filterToggle.closest('.filter-wrap');
      const willOpen = !wrap.classList.contains('open');
      document.querySelectorAll('.share-wrap.open, .filter-wrap.open').forEach(w => w.classList.remove('open'));
      if(willOpen) wrap.classList.add('open');
      return;
    }
    // Pilihan bidang dalam popup
    const filterOption = e.target.closest('.filter-option');
    if(filterOption){
      e.preventDefault();
      e.stopPropagation();
      const wrap = filterOption.closest('.filter-wrap');
      wrap.querySelectorAll('.filter-option').forEach(o => o.classList.remove('active'));
      filterOption.classList.add('active');
      selectedBidangFilter = filterOption.dataset.val;
      const toggleBtn = wrap.querySelector('.filter-toggle');
      const labelEl = toggleBtn.querySelector('.filter-label-text');
      const isSemua = selectedBidangFilter === 'semua';
      if(labelEl) labelEl.textContent = isSemua ? 'Bidang' : filterOption.textContent.trim();
      toggleBtn.classList.toggle('active-filter', !isSemua);
      wrap.classList.remove('open');
      applyBerandaFilters();
      return;
    }
  });
  // Tutup mana-mana popup (Share / Bidang) bila klik di luar
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.share-wrap')){
      document.querySelectorAll('.share-wrap.open').forEach(w => w.classList.remove('open'));
    }
    if(!e.target.closest('.filter-wrap')){
      document.querySelectorAll('.filter-wrap.open').forEach(w => w.classList.remove('open'));
    }
  });

  /* ---------------- Router ---------------- */
  function parseHash(){
    const raw = location.hash.replace(/^#\/?/, '');
    return raw.split('/').filter(Boolean).map(decodeURIComponent);
  }

  /* ---------------- Bina semula susunan history untuk pautan dalam (deep link) ----------------
   * Jika laman dibuka terus melalui pautan dalam (cth: #/s/subjek/t/tajuk atau .../r/siri)
   * tanpa melalui navigasi biasa, browser tidak mempunyai rekod peringkat atasnya
   * (Utama, Subjek). Akibatnya butang "Back" akan terus keluar dari laman.
   * Fungsi ini membina rekod history secara senyap (tanpa memaparkan semula/flicker)
   * supaya "Back" sentiasa berperingkat seperti biasa: Siri/Tajuk → Subjek (folder kitab) → Utama.
   */
  function primeHistoryForDeepLink(){
    const parts = parseHash();
    if(parts[0] !== 's' || !parts[1]) return; // bukan pautan dalam (deep link), tiada apa perlu dibina

    const ancestors = ['#/'];
    ancestors.push(`#/s/${parts[1]}`);
    if(parts[2] === 't' && parts[3]){
      ancestors.push(`#/s/${parts[1]}/t/${parts[3]}`);
    }

    const currentFullHash = location.hash || '#/';
    const chain = ancestors.filter(h => h !== currentFullHash);
    if(chain.length === 0) return; // sudah di peringkat Utama, tiada apa perlu dibina

    try{
      history.replaceState(null, '', chain[0]);
      for(let i = 1; i < chain.length; i++){
        history.pushState(null, '', chain[i]);
      }
      history.pushState(null, '', currentFullHash);
    } catch(e){ /* senyap jika sekatan persekitaran (mis. sandboxed iframe) */ }
  }

  function render(){
    const parts = parseHash();
    // #/s/:subjek/t/:tajuk/r/:siri
    if(parts[0] === 's' && parts[1] && parts[2] === 't' && parts[3] && parts[4] === 'r' && parts[5]){
      renderSiri(parts[1], parts[3], parts[5]);
    // #/s/:subjek/t/:tajuk
    } else if(parts[0] === 's' && parts[1] && parts[2] === 't' && parts[3]){
      renderTajuk(parts[1], parts[3]);
    // #/s/:subjek
    } else if(parts[0] === 's' && parts[1]){
      renderSubjek(parts[1]);
    } else {
      renderBeranda();
    }
    window.scrollTo({ top:0, behavior:'auto' });
  }

  function setCrumb(items){
    // items: [{label, href}], last item = current (no href)
    crumbEl.innerHTML = items.map((it, i) => {
      const isLast = i === items.length - 1;
      if(isLast) return `<span class="current">${escapeHtml(it.label)}</span>`;
      return `<a href="${it.href}">${escapeHtml(it.label)}</a><span class="sep">/</span>`;
    }).join('');
  }

  /* ---------------- Paparan: Beranda ---------------- */
  function renderBeranda(){
    document.title = "Majma' al-Mulahazat";
    setCrumb([{ label:'Utama' }]);

    // Reset penapis bidang setiap kali kembali ke Utama (paparan baharu)
    selectedBidangFilter = 'semua';

    // Di ruang Utama: tiada butang Kembali/Share pada bar bawah — hanya Menu di tengah.
    setBottomBar('', '');

    // Senarai bidang unik, diambil terus daripada nota-data.js (tiada perlu daftar berasingan)
    const bidangList = Array.from(new Set(SUBJEK.map(s => bidangLabel(s))))
      .sort((a, b) => a.localeCompare(b, 'ms'));

    const cards = SUBJEK.map((s, i) => `

        <div class="card-top">

        </div>

        <div class="card-foot">
          <span class="count">${s.tajuk.length} tajuk</span>
          <div class="card-foot-actions">
            <button type="button" class="icon-btn copy-btn" data-copy="#/s/${slug(s.nama)}" title="Salin pautan">${ICONS.copy}</button>
            <span class="chip-btn">Buka ${ICONS.arrow}</span>
          </div>

    const filterOptions = `

      </button>
      ${bidangList.map(b => `

          <span>${escapeHtml(b)}</span><span class="tick">${ICONS.check}</span>
        </button>

    `;

    view.innerHTML = `
      <div class="page-head">
        <div>
          <h2>Rak Kitab - Notagrafik</h2>
        </div>
        <div class="page-stats">
          <div class="stat"><span class="num mono">${SUBJEK.length}</span><span class="lbl">Subjek</span></div>
          <div class="stat"><span class="num mono">${totalTajuk()}</span><span class="lbl">Tajuk</span></div>
          <div class="stat"><span class="num mono">${totalSiri()}</span><span class="lbl">Siri</span></div>
        </div>
      </div>

      <div class="search-row">
        <div class="search-wrap">
          ${ICONS.search}
          <input type="text" id="cari" placeholder="Cari subjek atau tajuk…" autocomplete="off">
        </div>
        <div class="filter-wrap" id="filterWrap">
          <button type="button" class="btn filter-toggle">

          </button>
          <div class="filter-popup">${filterOptions}</div>
        </div>
      </div>

      <div class="shelf-case">
        <div class="shelf-case-head">${ICONS.shelf} Rak Kitab &middot; ${SUBJEK.length} subjek tersusun</div>
        <div class="grid shelf-grid" id="gridSubjek">${cards}</div>

  /* ---------------- Paparan: Subjek (senarai tajuk) ---------------- */
  function renderSubjek(subjekId){
    const s = findSubjek(subjekId);
    if(!s){ renderNotFound('Subjek tidak dijumpai.'); return; }

    document.title = `${s.nama} — Majma' al-Mulahazat`;
    setCrumb([{ label:'Utama', href:'#/' }, { label:s.nama }]);

    // Bar bawah: Kembali (kiri) ke Utama, Share (kanan) untuk subjek ini.
    setBottomBar(
      kembaliBlock('#/', false),
      shareBlock(`#/s/${slug(s.nama)}`, s.nama)
    );

    const subjKod = String(SUBJEK.indexOf(s) + 1).padStart(2, '0');

    const rows = s.tajuk.map((t, i) => {
      const adaBil = t.siri.filter(r => r.embed && r.embed.trim()).length;
      return `

          <span class="row-kod mono">${subjKod}.${i + 1}</span>
          <span class="row-main">

          <span class="row-meta">
            <span class="badge ${adaBil > 0 ? 'ready' : 'pending'}">${adaBil} / ${t.siri.length} siri tersedia</span>
            <div class="row-actions">
              <button type="button" class="icon-btn copy-btn" data-copy="#/s/${slug(s.nama)}/t/${slug(t.nama)}" title="Salin pautan">${ICONS.copy}</button>
              <span class="chip-btn">Buka ${ICONS.arrow}</span>

    }).join('');

    view.innerHTML = `
      <div class="page-head">
        <div>
          <h2>${escapeHtml(s.nama)}</h2>

        </div>

      <div class="row-list" id="senaraiTajuk">${rows || '<div style="padding:32px;color:var(--text-tertiary);font-size:13.5px;">Belum ada tajuk dalam subjek ini.</div>'}</div>
    `;

    const inputTajuk = document.getElementById('cariTajuk');
    const senaraiTajuk = document.getElementById('senaraiTajuk');
    if(inputTajuk){
      inputTajuk.addEventListener('input', () => {
        const q = inputTajuk.value.trim().toLowerCase();
        senaraiTajuk.querySelectorAll('.row').forEach(row => {

  }

  /* ---------------- Paparan: Tajuk (senarai siri) ---------------- */
  function renderTajuk(subjekId, tajukId){
    const s = findSubjek(subjekId);
    const t = s && findTajuk(s, tajukId);
    if(!s || !t){ renderNotFound('Tajuk tidak dijumpai.'); return; }

    document.title = `${t.nama} — Majma' al-Mulahazat`;
    setCrumb([{ label:'Utama', href:'#/' }, { label:s.nama, href:`#/s/${slug(s.nama)}` }, { label:t.nama }]);

    // Bar bawah: Kembali (kiri) ke Subjek, Share (kanan) untuk tajuk ini.
    setBottomBar(
      kembaliBlock(`#/s/${slug(s.nama)}`, false),
      shareBlock(`#/s/${slug(s.nama)}/t/${slug(t.nama)}`, t.nama)
    );

    const subjKod = String(SUBJEK.indexOf(s) + 1).padStart(2, '0');
    const tajukKod = `${subjKod}.${s.tajuk.indexOf(t) + 1}`;

    const rows = t.siri.map(r => {
      const ada = Boolean(r.embed && r.embed.trim());
      const label = siriLabel(r);
      const adaNama = Boolean(r.nama && String(r.nama).trim());

      return `
        <a class="row" href="${rowHash}" data-search="${escapeHtml((label + ' siri ' + r.siri).toLowerCase())}">
          <span class="row-kod mono">${tajukKod}.${r.siri}</span>
          <span class="row-main">

            ${adaNama ? `<p>Siri ${r.siri}</p>` : ''}
          </span>
          <span class="row-meta">
            <span class="badge ${ada ? 'ready' : 'pending'}">${ada ? 'Tersedia' : 'Belum siap'}</span>
            <div class="row-actions">
              <button type="button" class="icon-btn copy-btn" data-copy="${rowHash}" title="Salin pautan">${ICONS.copy}</button>
              <span class="chip-btn">Buka ${ICONS.arrow}</span>
            </div>
          </span>

    }).join('');

    view.innerHTML = `
      <div class="page-head">

        </div>

    `;

    const inputSiri = document.getElementById('cariSiri');
    const senaraiSiri = document.getElementById('senaraiSiri');
    if(inputSiri){
      inputSiri.addEventListener('input', () => {
        const q = inputSiri.value.trim().toLowerCase();
        senaraiSiri.querySelectorAll('.row').forEach(row => {
          row.style.display = row.dataset.search.includes(q) ? '' : 'none';
        });
      });

  /* ---------------- Paparan: Siri (nota + embed) ---------------- */
  function renderSiri(subjekId, tajukId, siriId){
    const s = findSubjek(subjekId);
    const t = s && findTajuk(s, tajukId);
    const r = t && findSiri(t, siriId);
    if(!s || !t || !r){ renderNotFound('Siri tidak dijumpai.'); return; }

    const label = siriLabel(r);
    const adaNamaSiri = Boolean(r.nama && String(r.nama).trim());
    document.title = `${t.nama} · ${label} — Majma' al-Mulahazat`;
    setCrumb([
      { label:'Utama', href:'#/' },
      { label:s.nama, href:`#/s/${slug(s.nama)}` },
      { label:t.nama, href:`#/s/${slug(s.nama)}/t/${slug(t.nama)}` },
      { label: label }
    ]);

    // Bar bawah: Kembali (kiri, gaya utama/gold) ke Tajuk, Share (kanan) untuk siri ini.
    setBottomBar(
      kembaliBlock(`#/s/${slug(s.nama)}/t/${slug(t.nama)}`, true),
      shareBlock(`#/s/${slug(s.nama)}/t/${slug(t.nama)}/r/${r.siri}`, `${t.nama} — ${label}`)
    );

    const ada = Boolean(r.embed && r.embed.trim());

    // Kedudukan siri semasa dalam tajuk (untuk navigasi leret/drag, macam muka surat)
    const idx = t.siri.indexOf(r);
    const adaSebelum = idx > 0;
    const adaSelepas = idx < t.siri.length - 1;
    const siriSebelum = adaSebelum ? t.siri[idx - 1] : null;
    const siriSelepas = adaSelepas ? t.siri[idx + 1] : null;

    const gotoSiri = (target) => {
      if(!target) return;
      location.hash = `#/s/${slug(s.nama)}/t/${slug(t.nama)}/r/${target.siri}`;
    };

    const dots = t.siri.map((row, i) => `<span class="dot${i === idx ? ' active' : ''}"></span>`).join('');

    view.innerHTML = `
      <div class="viewer-head">
        <div class="viewer-title">
          <h2>${escapeHtml(t.nama)} — ${escapeHtml(label)}</h2>
          ${adaNamaSiri ? `<div class="meta"><span class="mono">Siri ${r.siri}</span></div>` : ''}
        </div>
      </div>

      <div class="page-nav" id="pageNav">
        ${ada ? `
          <div class="frame-wrap entering" id="frameWrap">
            <div class="frame-chrome" id="frameChrome">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              <span class="mono">nota.site/${slug(s.nama)}/${slug(t.nama)}/siri-${r.siri}</span>
            </div>
            <iframe src="${r.embed}" loading="lazy" title="${escapeHtml(t.nama)} Siri ${r.siri}"></iframe>
          </div>
        ` : `
          <div class="empty" id="frameWrap">
            <div class="glyph">${ICONS.doc}</div>
            <h3>Nota belum tersedia</h3>
            <p>Siri ini belum mempunyai pautan nota. Tambah pautan "Embed this page" dari Notion pada medan <code>embed</code> bagi siri ini di dalam nota-data.js.</p>
            <code>siri: ${r.siri}, nama: "…" → embed: "https://…notion.site/…"</code>
          </div>
        `}
      </div>

      ${t.siri.length > 1 ? `
        <div class="page-indicator">
          <div class="dots-row">
            ${dots}
            <span class="lbl mono">Siri ${idx + 1} / ${t.siri.length}</span>
          </div>
          <span class="hint">${ICONS.swipe} Leret di mana-mana skrin atau seret bar atas untuk tukar siri — kekunci ← → juga berfungsi</span>
        </div>
      ` : ''}
    `;

    // ---- Navigasi: leret (mobile, seluruh skrin), seret tetikus (desktop), kekunci panah ----
    const frameWrap = document.getElementById('frameWrap');
    const frameChrome = document.getElementById('frameChrome');

    const navigate = (dir) => {
      const target = dir === 'prev' ? siriSebelum : siriSelepas;
      if(!target || !frameWrap) return;
      frameWrap.classList.add(dir === 'prev' ? 'sliding-right' : 'sliding-left');
      setTimeout(() => gotoSiri(target), 140);
    };

    function onKey(e){
      if(e.key === 'ArrowLeft') navigate('prev');
      else if(e.key === 'ArrowRight') navigate('next');
    }
    document.addEventListener('keydown', onKey);

    // Leret sentuhan (mobile) — dipasang pada seluruh dokumen supaya
    // sentuhan di mana-mana bahagian skrin (bukan setakat kad nota) boleh
    // menukar siri, lebih mudah dan selesa digunakan sebelah tangan.
    // Nota: sentuhan di ATAS iframe Notion sendiri tidak boleh dikesan
    // oleh halaman induk disebabkan sekatan cross-origin browser; oleh itu
    // bar judul (frame-chrome) turut disediakan sebagai kawasan seret khas (desktop).
    let touchStartX = null;
    let touchStartY = null;
    function onTouchStart(e){
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
    function onTouchEnd(e){
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = null; touchStartY = null;
      if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return; // pastikan leret mendatar, elak konflik dgn scroll menegak
      if(dx > 0) navigate('prev'); else navigate('next');
    }
    document.addEventListener('touchstart', onTouchStart, { passive:true });
    document.addEventListener('touchend', onTouchEnd, { passive:true });

    // Bersihkan semua listener bila pandangan bertukar
    window.addEventListener('hashchange', () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('touchstart', onTouchStart);
      document.removeEventListener('touchend', onTouchEnd);
    }, { once:true });

    // Seret tetikus (desktop) — pada bar judul kad nota, sebab kandungan
    // iframe sendiri tidak boleh dikesan gerakan tetikusnya (cross-origin).
    if(frameChrome){
      let isDragging = false;
      let dragStartX = 0;

      frameChrome.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStartX = e.clientX;
      });
      window.addEventListener('mousemove', (e) => {
        if(!isDragging) return;
        e.preventDefault();
      });
      window.addEventListener('mouseup', (e) => {
        if(!isDragging) return;
        isDragging = false;
        const dx = e.clientX - dragStartX;
        if(Math.abs(dx) < 60) return;
        if(dx > 0) navigate('prev'); else navigate('next');
      });
    }
  }

  function renderNotFound(mesej){
    setCrumb([{ label:'Utama', href:'#/' }, { label:'Tidak dijumpai' }]);
    setBottomBar('', '');
    view.innerHTML = `
      <div class="empty">
        <div class="glyph">${ICONS.folder}</div>
        <h3>${escapeHtml(mesej)}</h3>
        <p>Pautan ini mungkin telah dialih keluar atau ditukar. Kembali ke utama untuk mencari semula.</p>
        <a class="btn primary" href="#/" style="margin-top:18px;">Kembali ke Utama</a>
      </div>
    `;
  }

  /* ---------------- Butang bulat MENU (ala iPhone) ---------------- */
  const fabWrap = document.getElementById('fabWrap');
  const fabToggle = document.getElementById('fabToggle');
  const fabTop = document.getElementById('fabTop');
  const fabHome = document.getElementById('fabHome');

  fabToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    fabWrap.classList.toggle('open');
  });
  fabTop.addEventListener('click', () => {
    fabWrap.classList.remove('open');
  });
  fabHome.addEventListener('click', () => {
    fabWrap.classList.remove('open');
  });
  document.addEventListener('click', (e) => {
    if(!fabWrap.contains(e.target)) fabWrap.classList.remove('open');
  });

  /* ---------------- Togol Mod Cerah / Gelap ----------------
   * Nota: state disimpan dalam memori JS sahaja (bukan localStorage),
   * jadi ia akan reset kepada Mod Gelap (asal) bila laman dimuat semula.
   * Jika laman ini dihoskan di luar (bukan dalam pratonton artifact),
   * anda boleh tambah localStorage.setItem/getItem di sini untuk
   * mengekalkan pilihan pengguna merentasi lawatan.
   */
  let isLightTheme = false;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const themeLabel = document.getElementById('themeLabel');
  function applyTheme(){
    document.body.classList.toggle('theme-light', isLightTheme);
    if(themeIcon) themeIcon.innerHTML = isLightTheme ? ICONS.moon : ICONS.candle;
    if(themeLabel) themeLabel.textContent = isLightTheme ? 'Mod Gelap' : 'Mod Cerah';
  }
  if(themeToggle){
    themeToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      isLightTheme = !isLightTheme;
      applyTheme();
      fabWrap.classList.remove('open');
    });
  }
  applyTheme();

  /* ---------------- Support Button: bubble tooltip berulang ---------------- */
  const supportBubble = document.getElementById('supportBubble');
  function cycleBubble(){
    supportBubble.classList.add('show');
    setTimeout(() => {
      supportBubble.classList.remove('show');
      setTimeout(cycleBubble, 10000);
    }, 5000);
  }
  setTimeout(cycleBubble, 1500);

  window.addEventListener('hashchange', render);
  window.addEventListener('DOMContentLoaded', render);
  primeHistoryForDeepLink();
  render();
})();
</script>
</body>
</html>
